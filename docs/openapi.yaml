  /authors/{userId}:
    get:
      tags: [Profils]
      operationId: getAuthor
      summary: Consulter le profil public d'un auteur
      description: Profil public d'un auteur (nom, biographie, avatar, site web), par exemple pour la page « auteur » d'un blog. L'adresse e-mail n'est jamais exposée.
      security: []
