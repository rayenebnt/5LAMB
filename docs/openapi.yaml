      tags: [Médias]
      operationId: listMedia
      summary: Lister les médias
      description: |-
        Médias du plus récent au plus ancien. Sans la permission `media:read:any`, seuls les médias de l'appelant sont accessibles (`owner` absent, `me` ou son propre identifiant, sinon `403`). Les éditeurs et administrateurs voient toute la médiathèque et peuvent filtrer par propriétaire.
