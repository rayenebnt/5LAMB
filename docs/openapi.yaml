          type: string
          maxLength: 300
          nullable: true
          description: Texte alternatif (accessibilité) ; `null` ou vide, aucun.
    MediaUpdateRequest:
      type: object
      additionalProperties: false
      required: [altText]
      properties:
        altText:
          type: string
          maxLength: 300
          nullable: true
          description: Nouveau texte alternatif (`null` ou vide pour le supprimer).

    # ------------------------------------------------------------------ Search
    SearchHit:
      type: object
      description: Article trouvé (résumé copié dans l'index de recherche) et pertinence. Les valeurs absentes de l'index valent `null`.
      required: [id, slug, title, excerpt, coverImageUrl, tags, author, publishedAt, readingTimeMinutes, score, matchedTerms]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        excerpt:
          type: string
        coverImageUrl:
          type: string
          format: uri
          nullable: true
        tags:
          type: array
          items:
            type: string
        author:
          type: object
          description: Auteur de l'article.
          required: [id, name]
          properties:
            id:
              type: string
              format: uuid
              nullable: true
              description: Identifiant de l'auteur (`sub` Cognito).
            name:
              type: string
              nullable: true
              description: Nom affiché de l'auteur.
        publishedAt:
          type: string
          format: date-time
          nullable: true
        readingTimeMinutes:
          type: integer
          minimum: 1
          nullable: true
        score:
          type: number
          minimum: 0
          description: Score de pertinence cumulé des termes trouvés.
        matchedTerms:
          type: integer
          minimum: 1
          description: Nombre de termes de la requête présents dans l'article.
    SearchResults:
      type: object
      required: [query, terms, total, items]
      properties:
        query:
          type: string
          description: Texte recherché, tel que reçu.
        terms:
          type: array
          maxItems: 8
          description: Termes normalisés effectivement recherchés.
          items:
            type: string
        total:
          type: integer
          minimum: 0
          description: Nombre total d'articles correspondants (avant la limite `limit`).
        items:
          type: array
          description: Les `limit` articles les plus pertinents.
          items:
            $ref: '#/components/schemas/SearchHit'
      example:
        query: Lambda et DynamoDB
        terms: [lambda, dynamodb]
        total: 1
        items:
          - id: 0192f4a0-5b1c-7d2e-8f3a-4b5c6d7e8f90
