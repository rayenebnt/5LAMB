        Permission `comment:moderate` (éditeurs et administrateurs).
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: Statut des commentaires à lister.
          schema:
            type: string
            enum: [pending, approved, rejected, spam]
            default: pending
        - $ref: '#/components/parameters/Limit100'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page de la file de modération.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModeratorCommentList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '5XX':
          $ref: '#/components/responses/ServerError'

  # ---------------------------------------------------------------------------
  # Médias (MediaFunction)
  # ---------------------------------------------------------------------------
  /media:
    post:
      tags: [Médias]
      operationId: requestMediaUpload
      summary: Demander le téléversement d'un média
      description: |-
        Première étape du téléversement (voir « Téléversement des médias » en introduction) : enregistre le média au statut `pending` et renvoie dans `upload` une autorisation de téléversement **direct vers Amazon S3** (presigned POST, valable 15 minutes).

        Envoyez ensuite le fichier dans une requête `multipart/form-data` vers `upload.url`, avec **tous** les champs de `upload.fields` suivis du fichier dans le champ `file` :

        ```bash
        curl -X POST "<upload.url>" -F "key=<fields.key>" -F "Policy=<fields.Policy>" … -F "file=@schema-architecture.png"
        ```

        S3 répond `204 No Content`. Le fichier est ensuite validé de façon asynchrone (type réel, taille, signature binaire) : interrogez `GET /media/{mediaId}` jusqu'au statut `ready` (URL disponible) ou `rejected`.

        Permission `media:upload` (tous les rôles).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaUploadRequest'
            example:
              filename: Schéma architecture.PNG
              contentType: image/png
              size: 48213
              altText: Schéma de l'architecture serverless
      responses:
        '201':
          description: Média enregistré (`pending`) et autorisation de téléversement.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaUpload'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          description: Taille déclarée (`size`) supérieure à la limite de son type (10 Mio par défaut pour une image, 200 Mio pour une vidéo), ou corps de requête trop volumineux (`PAYLOAD_TOO_LARGE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: PAYLOAD_TOO_LARGE
                  message: Images must not exceed 10485760 bytes
                requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
        '415':
          description: Type de fichier non pris en charge (SVG, PDF…), ou corps de requête qui n'est pas en JSON (`UNSUPPORTED_MEDIA_TYPE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: UNSUPPORTED_MEDIA_TYPE
                  message: 'Unsupported content type image/svg+xml'
                requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '5XX':
          $ref: '#/components/responses/ServerError'
    get:
      tags: [Médias]
      operationId: listMedia
      summary: Lister les médias
      description: |-
        Médias du plus récent au plus ancien. Sans la permission `media:read:any`, seuls les médias de l'appelant sont accessibles (`owner` absent, `me` ou son propre identifiant, sinon `403`). Les éditeurs et administrateurs voient toute la médiathèque et peuvent filtrer par propriétaire.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit100'
        - $ref: '#/components/parameters/Cursor'
        - name: owner
          in: query
          required: false
          description: Propriétaire des médias, `me` ou identifiant (`sub` Cognito) d'un utilisateur. Par défaut, les médias de l'appelant (ou toute la médiathèque pour les éditeurs et administrateurs).
          schema:
            type: string
            minLength: 1
          example: me
      responses:
        '200':
          description: Page de médias.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '5XX':
          $ref: '#/components/responses/ServerError'

  /media/{mediaId}:
    get:
      tags: [Médias]
      operationId: getMedia
      summary: Consulter un média
      description: |-
        Détails d'un média. Un média `ready` est public ; un média `pending` ou `rejected` n'est visible que de son propriétaire et des éditeurs et administrateurs (sinon `404`).

        `url` est l'URL CloudFront permanente du fichier, ou, sans CDN, une URL S3 présignée temporaire (voir `urlExpiresAt`).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MediaId'
      responses:
        '200':
          description: Média.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Media'
              examples:
                ready:
                  summary: Média validé (CDN)
                  value:
                    id: 0192f4c2-3d4e-7f5a-8b6c-7d8e9f0a1b2c
                    filename: schema-architecture.png
                    contentType: image/png
                    kind: image
                    size: 48213
                    status: ready
                    altText: Schéma de l'architecture serverless
                    url: https://d1a2b3c4d5e6f7.cloudfront.net/media/0192f4c2-3d4e-7f5a-8b6c-7d8e9f0a1b2c/schema-architecture.png
                    owner:
                      id: 3f8a2b1c-4d5e-4f60-8a7b-9c0d1e2f3a4b
                      name: Gaby Martin
                    createdAt: '2026-10-24T16:40:00.000Z'
                    updatedAt: '2026-10-24T16:40:03.000Z'
                presigned:
                  summary: Média validé (URL S3 présignée, sans CDN)
                  value:
                    id: 0192f4c2-3d4e-7f5a-8b6c-7d8e9f0a1b2c
                    filename: schema-architecture.png
                    contentType: image/png
                    kind: image
                    size: 48213
                    status: ready
                    altText: Schéma de l'architecture serverless
                    url: https://blogify-dev-mediabucket-1x2y3z4w5v6u.s3.eu-west-3.amazonaws.com/media/0192f4c2-3d4e-7f5a-8b6c-7d8e9f0a1b2c/schema-architecture.png?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Expires=3600&X-Amz-Signature=5d2c3b1a0f9e8d7c
                    urlExpiresAt: '2026-10-24T17:40:03.000Z'
                    owner:
                      id: 3f8a2b1c-4d5e-4f60-8a7b-9c0d1e2f3a4b
                      name: Gaby Martin
                    createdAt: '2026-10-24T16:40:00.000Z'
                    updatedAt: '2026-10-24T16:40:03.000Z'
                rejected:
                  summary: Média refusé par la validation
                  value:
                    id: 0192f4c2-3d4e-7f5a-8b6c-7d8e9f0a1b2c
                    filename: schema-architecture.png
                    contentType: image/png
                    kind: image
                    size: 48213
                    status: rejected
                    altText: Schéma de l'architecture serverless
                    url: null
                    owner:
                      id: 3f8a2b1c-4d5e-4f60-8a7b-9c0d1e2f3a4b
                      name: Gaby Martin
                    rejectionReason: The file content does not match the declared type image/png
                    createdAt: '2026-10-24T16:40:00.000Z'
                    updatedAt: '2026-10-24T16:40:03.000Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '5XX':
          $ref: '#/components/responses/ServerError'
    patch:
      tags: [Médias]
      operationId: updateMedia
      summary: Modifier le texte alternatif d'un média
      description: Modifie le texte alternatif (accessibilité) d'un média ; `null` le supprime. Autorisé au propriétaire (permission `media:upload`) ainsi qu'aux éditeurs et administrateurs (`media:delete:any`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MediaId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaUpdateRequest'
            example:
              altText: Schéma de l'architecture serverless (API Gateway, Lambda, DynamoDB)
      responses:
        '200':
          description: Média modifié.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Media'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '5XX':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [Médias]
      operationId: deleteMedia
      summary: Supprimer un média
      description: Supprime le fichier S3 puis le média. Autorisé au propriétaire (permission `media:upload`) ainsi qu'aux éditeurs et administrateurs (`media:delete:any`). Les articles qui utilisent son URL ne sont pas modifiés.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MediaId'
      responses:
        '204':
          description: Média supprimé.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '5XX':
          $ref: '#/components/responses/ServerError'

  # ---------------------------------------------------------------------------
  # Recherche (SearchFunction)
  # ---------------------------------------------------------------------------
  /search:
    get:
      tags: [Recherche]
      operationId: searchPosts
      summary: Rechercher des articles
      description: |-
        Recherche plein texte dans les articles publiés (titre, tags, résumé et contenu). La requête est découpée en termes normalisés (minuscules, sans accents, mots vides français et anglais ignorés, 8 termes au plus).

        Les résultats sont classés par nombre de termes trouvés, puis par score de pertinence (terme du titre +10, d'un tag +6, du résumé +3, du contenu +1 par occurrence jusqu'à +5), puis par date de publication. Une requête sans terme significatif renvoie une liste vide.

        L'index est mis à jour de façon asynchrone, quelques secondes après une publication. Réponse cachable 60 secondes.
      security: []
      parameters:
        - name: q
          in: query
          required: true
          description: Texte recherché.
          schema:
            type: string
            minLength: 1
            maxLength: 200
          example: lambda dynamodb
        - $ref: '#/components/parameters/Limit50'
      responses:
        '200':
          description: Résultats de recherche (les `limit` meilleurs).
          headers:
            Cache-Control:
              description: Réponse publique cachable 60 secondes.
              schema:
                type: string
                example: 'public, max-age=60'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResults'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '5XX':
          $ref: '#/components/responses/ServerError'

  /tags:
    get:
      tags: [Recherche]
      operationId: listTags
      summary: Lister les tags
      description: Tags des articles publiés avec leur nombre d'articles, du plus utilisé au moins utilisé puis par ordre alphabétique (nuage de tags). Mis à jour de façon asynchrone ; réponse cachable 5 minutes.
      security: []
      responses:
        '200':
          description: Tags utilisés par au moins un article publié.
          headers:
            Cache-Control:
              description: Réponse publique cachable 5 minutes.
              schema:
                type: string
                example: 'public, max-age=300'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagList'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '5XX':
          $ref: '#/components/responses/ServerError'

  # ---------------------------------------------------------------------------
  # Newsletter (SubscriptionsFunction)
  # ---------------------------------------------------------------------------
  /subscriptions:
    post:
      tags: [Newsletter]
      operationId: subscribe
      summary: S'abonner à la newsletter
      description: |-
        Abonne une adresse e-mail aux annonces des nouveaux articles (Amazon SNS). SNS envoie un e-mail de confirmation (double opt-in) : l'abonnement n'est actif qu'après un clic sur le lien qu'il contient. Chaque annonce comporte un lien de désabonnement.

        Avec `tags`, seuls les articles portant au moins l'un de ces tags sont annoncés (politique de filtrage SNS) ; sans `tags`, tous les articles le sont. Limite de débit renforcée (2 requêtes/s).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionRequest'
            examples:
              all:
                summary: Tous les nouveaux articles
                value:
                  email: lectrice@example.com
              filtered:
                summary: Uniquement certains tags
                value:
                  email: lectrice@example.com
                  tags: [Serverless, DynamoDB]
      responses:
        '202':
          description: Demande enregistrée, confirmation à effectuer depuis l'e-mail reçu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionPending'
        '400':
          description: Données invalides (`VALIDATION_ERROR`) ou adresse refusée par Amazon SNS (`BAD_REQUEST`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidEmail:
                  $ref: '#/components/examples/InvalidEmail'
        '409':
          description: Cette adresse est déjà abonnée avec des préférences différentes (`ALREADY_SUBSCRIBED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: ALREADY_SUBSCRIBED
                  message: This e-mail address is already subscribed
                requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '5XX':
          $ref: '#/components/responses/ServerError'
    get:
      tags: [Newsletter]
      operationId: listSubscriptions
      summary: Lister les abonnés à la newsletter
      description: Liste paginée des abonnements e-mail et de leur état de confirmation. Permission `subscription:read` (administrateurs).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page d'abonnements.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '5XX':
          $ref: '#/components/responses/ServerError'

  # ---------------------------------------------------------------------------
  # Système (DocsFunction)
  # ---------------------------------------------------------------------------
  /docs:
    get:
      tags: [Système]
      operationId: getSwaggerUi
      summary: Documentation interactive (Swagger UI)
      description: Page HTML de documentation interactive générée à partir de ce document OpenAPI (Swagger UI). Cliquez sur **Authorize** et collez un ID token pour essayer les routes protégées.
      security: []
      responses:
        '200':
          description: Page HTML Swagger UI.
          headers:
            Cache-Control:
              description: Page cachable 5 minutes.
              schema:
                type: string
                example: 'public, max-age=300'
            Content-Security-Policy:
              description: Politique de sécurité du contenu (scripts limités au CDN de Swagger UI et au script d'initialisation de la page).
              schema:
                type: string
          content:
            text/html:
              schema:
                type: string
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '5XX':
          $ref: '#/components/responses/ServerError'

  /openapi.json:
    get:
      tags: [Système]
      operationId: getOpenApiDocument
      summary: Document OpenAPI (JSON)
      description: Ce document OpenAPI 3.0.3 au format JSON, par exemple pour générer un client. `servers` y est remplacé par l'URL (domaine et stage) par laquelle l'API a été appelée.
      security: []
      responses:
        '200':
          description: Document OpenAPI.
          headers:
            Cache-Control:
              description: Document cachable 5 minutes.
              schema:
                type: string
                example: 'public, max-age=300'
          content:
            application/json:
              schema:
                type: object
                description: Document OpenAPI 3.0.3.
                required: [openapi, info, paths]
                properties:
                  openapi:
                    type: string
                    example: '3.0.3'
                  info:
                    type: object
                  servers:
                    type: array
                    items:
                      type: object
                  paths:
                    type: object
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '5XX':
          $ref: '#/components/responses/ServerError'

  /health:
    get:
      tags: [Système]
      operationId: getHealth
      summary: État de santé du service
      description: Vérification de disponibilité, sans appel aux autres services AWS (supervision, tests de fumée). Renvoie la version et le stage déployés.
      security: []
      responses:
        '200':
          description: Service disponible.
          headers:
            Cache-Control:
              description: Jamais mis en cache.
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '5XX':
          $ref: '#/components/responses/ServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |-
        Jeton d'identité **Amazon Cognito** (Cognito ID token, JWT signé RS256), champ `idToken` des réponses de `POST /auth/login`, `POST /auth/refresh` et `POST /auth/new-password`, envoyé dans l'en-tête `Authorization: Bearer <idToken>`.

        L'access token est refusé : seul l'ID token porte les claims `email`, `name` et `cognito:groups` (rôles) utilisés par l'API. Validité : 60 minutes.

  parameters:
    PostIdOrSlug:
      name: postId
      in: path
      required: true
      description: Identifiant (UUID) **ou slug** de l'article.
      schema:
        type: string
        minLength: 1
        maxLength: 80
      examples:
        id:
          summary: Identifiant
          value: 0192f4a0-5b1c-7d2e-8f3a-4b5c6d7e8f90
        slug:
          summary: Slug
          value: architecture-serverless-avec-aws-lambda
    PostId:
      name: postId
      in: path
      required: true
      description: Identifiant (UUID) de l'article.
      schema:
        type: string
        format: uuid
      example: 0192f4a0-5b1c-7d2e-8f3a-4b5c6d7e8f90
    CommentId:
      name: commentId
      in: path
      required: true
      description: Identifiant (UUID) du commentaire.
      schema:
        type: string
        format: uuid
      example: 0192f4b0-1a2b-7c3d-8e4f-5a6b7c8d9e0f
    MediaId:
      name: mediaId
      in: path
      required: true
      description: Identifiant (UUID) du média.
      schema:
        type: string
        format: uuid
      example: 0192f4c2-3d4e-7f5a-8b6c-7d8e9f0a1b2c
    UserId:
      name: userId
      in: path
      required: true
      description: Identifiant de l'utilisateur (`sub` Cognito, UUID).
      schema:
        type: string
        format: uuid
      example: 3f8a2b1c-4d5e-4f60-8a7b-9c0d1e2f3a4b
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: |-
        Version attendue de l'article : valeur de l'en-tête `ETag` reçue lors de la dernière lecture (`"v3"`). Si l'article a été modifié entre-temps, la requête est refusée avec `412 PRECONDITION_FAILED`.
        Formats acceptés : `"v3"`, `W/"v3"`, `v3` ou `3` ; `*` ou en-tête absent : pas de contrôle. Valeur mal formée → `400 BAD_REQUEST`.
      schema:
        type: string
      example: '"v3"'
    Cursor:
      name: cursor
      in: query
      required: false
      description: Curseur opaque de pagination, valeur `nextCursor` de la page précédente.
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    Limit50:
      name: limit
      in: query
      required: false
      description: Nombre maximal d'éléments renvoyés (1 à 50).
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 10
    Limit60:
      name: limit
      in: query
      required: false
      description: Nombre maximal d'éléments renvoyés (1 à 60).
      schema:
        type: integer
        minimum: 1
        maximum: 60
        default: 20
    Limit100:
      name: limit
      in: query
      required: false
      description: Nombre maximal d'éléments renvoyés (1 à 100).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  headers:
    ETag:
      description: Version courante de l'article (`"v<version>"`), à renvoyer dans l'en-tête `If-Match` d'une modification.
      schema:
        type: string
        example: '"v4"'
    Location:
      description: Chemin de la ressource créée (relatif à l'URL de base de l'API).
      schema:
        type: string
        example: /posts/0192f6e1-8a2b-7c3d-9e4f-5a6b7c8d9e0f
    CacheControl:
      description: |-
        `public, max-age=60, stale-while-revalidate=300` pour un appel anonyme sur un contenu public ; `private, no-store` dès qu'un jeton est fourni ou que le contenu n'est pas public.
      schema:
        type: string
        example: 'public, max-age=60, stale-while-revalidate=300'
    RetryAfter:
      description: Délai conseillé, en secondes, avant de réessayer (réponses `503`).
      schema:
        type: integer
        example: 1
    WwwAuthenticate:
      description: Schéma d'authentification attendu (`Bearer`), présent lorsque le refus provient de l'authorizer d'API Gateway.
      schema:
        type: string
        example: Bearer

  examples:
    InvalidEmail:
      summary: Adresse e-mail invalide (VALIDATION_ERROR)
      value:
        error:
          code: VALIDATION_ERROR
          message: Request validation failed
          details:
            - field: email
              message: Invalid e-mail address
        requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
    InvalidPassword:
      summary: Mot de passe refusé par Cognito (INVALID_PASSWORD)
      value:
        error:
          code: INVALID_PASSWORD
          message: 'Password did not conform with policy: Password must have uppercase characters'
        requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
    InvalidCode:
      summary: Code incorrect (INVALID_CODE)
      value:
        error:
          code: INVALID_CODE
          message: Invalid verification code provided, please try again.
        requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
    ExpiredCode:
      summary: Code expiré (EXPIRED_CODE)
      value:
        error:
          code: EXPIRED_CODE
          message: Invalid code provided, please request a code again.
        requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e

  responses:
    BadRequest:
      description: Requête invalide. `VALIDATION_ERROR` (avec `details`) pour un corps ou des paramètres non conformes, champ inconnu compris ; `BAD_REQUEST` pour un JSON mal formé, un curseur de pagination ou un en-tête `If-Match` invalide.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            validation:
              summary: Champ invalide ou inconnu (VALIDATION_ERROR)
              value:
                error:
                  code: VALIDATION_ERROR
                  message: Request validation failed
                  details:
                    - field: title
                      message: 'Too small: expected string to have >=1 characters'
                    - field: (root)
                      message: 'Unknown field(s): status'
                requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
            malformedJson:
              summary: JSON mal formé (BAD_REQUEST)
              value:
                error:
                  code: BAD_REQUEST
                  message: Request body must be valid JSON
                requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
            invalidCursor:
              summary: Curseur de pagination invalide (BAD_REQUEST)
              value:
                error:
                  code: BAD_REQUEST
                  message: Invalid pagination cursor
                requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
    Unauthorized:
      description: Jeton absent, mal formé, invalide ou expiré (`UNAUTHORIZED`). Obtenez un ID token avec `POST /auth/login` ou `POST /auth/refresh`.
      headers:
        WWW-Authenticate:
          $ref: '#/components/headers/WwwAuthenticate'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: UNAUTHORIZED
              message: Missing, invalid or expired token
            requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
    InvalidRefreshToken:
      description: Refresh token invalide, expiré ou révoqué (`INVALID_TOKEN`) ; l'utilisateur doit se reconnecter.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: INVALID_TOKEN
              message: Invalid or expired refresh token
            requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
    Forbidden:
      description: L'appelant est authentifié mais son rôle n'accorde pas la permission nécessaire (`FORBIDDEN`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: FORBIDDEN
              message: You do not have permission to perform this action
            requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
    NotFound:
      description: Ressource inexistante, ou non visible par l'appelant (`NOT_FOUND`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: NOT_FOUND
              message: Resource not found
            requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
    WorkflowConflict:
      description: Transition impossible depuis le statut actuel de l'article (`INVALID_STATE_TRANSITION`), ou modification concurrente persistante sans `If-Match` (`CONFLICT`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidTransition:
              summary: Transition interdite
              value:
                error:
                  code: INVALID_STATE_TRANSITION
                  message: Cannot publish a post whose status is 'published'
                requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
            concurrentUpdate:
              summary: Écritures simultanées
              value:
                error:
                  code: CONFLICT
                  message: The post was modified concurrently, please retry
                requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
    UserExists:
      description: Un compte existe déjà pour cette adresse e-mail (`USER_EXISTS`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: USER_EXISTS
              message: An account already exists for this e-mail address
            requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
    PreconditionFailed:
      description: >-
        L'article a été modifié depuis sa lecture : la version indiquée par `If-Match` n'est plus la version courante (`PRECONDITION_FAILED`). Relisez l'article puis réessayez.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: PRECONDITION_FAILED
              message: The resource was modified by another request (version mismatch)
            requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
    PayloadTooLarge:
      description: Corps de requête supérieur à 1 Mio (`PAYLOAD_TOO_LARGE`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: PAYLOAD_TOO_LARGE
              message: Request body must not exceed 1048576 bytes
            requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
    UnsupportedMediaType:
      description: >-
        Le corps de la requête doit être envoyé en JSON (`Content-Type: application/json`) (`UNSUPPORTED_MEDIA_TYPE`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: UNSUPPORTED_MEDIA_TYPE
              message: Content-Type must be application/json
            requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
    TooManyRequests:
      description: Limite de débit d'API Gateway dépassée, ou trop de tentatives auprès d'Amazon Cognito (`TOO_MANY_REQUESTS`). Réessayez plus tard, avec un délai croissant.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: TOO_MANY_REQUESTS
              message: Rate limit exceeded, retry later
            requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
    ServerError:
      description: |-
        Erreur côté serveur : `500 INTERNAL_ERROR` (erreur inattendue, sans détail interne : communiquez le `requestId`), `503 SERVICE_UNAVAILABLE` (service AWS momentanément saturé, réessayer après `Retry-After` secondes), `502`/`504` (échec ou dépassement de délai de la fonction, renvoyés par API Gateway).
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            internal:
              summary: Erreur inattendue (500)
              value:
                error:
                  code: INTERNAL_ERROR
                  message: An unexpected error occurred
                requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
            unavailable:
              summary: Service momentanément saturé (503)
              value:
                error:
                  code: SERVICE_UNAVAILABLE
                  message: The service is busy, please retry shortly
                requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e

  schemas:
    # ------------------------------------------------------------------ Errors
    Error:
      type: object
      description: Enveloppe commune à toutes les erreurs (fonctions Lambda et réponses d'API Gateway).
      required: [error, requestId]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Code d'erreur stable, exploitable par programme (voir le tableau des codes en introduction).
              example: NOT_FOUND
            message:
              type: string
              description: Message lisible (en anglais), destiné aux développeurs ; ne pas l'analyser.
              example: Resource not found
            details:
              type: array
              description: Liste des problèmes détectés (erreurs de validation `VALIDATION_ERROR`).
              items:
                $ref: '#/components/schemas/ErrorDetail'
        requestId:
          type: string
          description: Identifiant de la requête, à communiquer pour retrouver la requête dans les journaux.
          example: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
    ErrorDetail:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: Chemin du champ en erreur (`tags.2` pour un élément de tableau, `(root)` pour l'objet entier, par exemple un champ inconnu).
          example: title
        message:
          type: string
          example: 'Too small: expected string to have >=1 characters'
    Message:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: Message d'information (en anglais).
          example: Check your inbox to continue.

    # ------------------------------------------------------- Shared / users
    Email:
      type: string
      format: email
      maxLength: 254
      description: Adresse e-mail (espaces supprimés, normalisée en minuscules).
      example: gaby.martin@example.com
    Password:
      type: string
      format: password
      minLength: 8
      maxLength: 256
      pattern: '^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])'
      description: Mot de passe d'au moins 8 caractères contenant une minuscule, une majuscule et un chiffre (politique du user pool Cognito).
      example: Blogify2026!
    Role:
      type: string
      enum: [admin, editor, guest-author]
      description: Rôle (groupe Cognito) d'un utilisateur.
      example: editor
    Permission:
      type: string
      enum:
        - 'post:create'
        - 'post:read:any'
        - 'post:update:own'
        - 'post:update:any'
        - 'post:delete:own'
        - 'post:delete:any'
        - 'post:submit'
        - 'post:publish'
        - 'comment:moderate'
        - 'media:upload'
        - 'media:read:any'
        - 'media:delete:any'
        - 'user:manage'
        - 'subscription:read'
      description: Permission accordée par un rôle (matrice RBAC).
      example: 'post:create'
    UserRef:
      type: object
      description: Référence vers un utilisateur (auteur d'un article, propriétaire d'un média).
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
          description: Identifiant de l'utilisateur (`sub` Cognito).
          example: 3f8a2b1c-4d5e-4f60-8a7b-9c0d1e2f3a4b
        name:
          type: string
          description: Nom affiché (au moment de la création de la ressource).
          example: Gaby Martin
    UserProfile:
      type: object
      description: Profil complet de l'utilisateur connecté.
      required: [id, email, name, role, roles, permissions, bio, avatarUrl, website, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          description: Identifiant de l'utilisateur (`sub` Cognito).
        email:
          type: string
          format: email
        name:
          type: string
          maxLength: 80
          description: Nom affiché.
        role:
          type: string
          enum: [admin, editor, guest-author, null]
          nullable: true
          description: Rôle principal (le plus élevé), `null` pour un compte sans groupe.
        roles:
          type: array
          description: Tous les rôles du compte, du plus au moins privilégié.
          items:
            $ref: '#/components/schemas/Role'
        permissions:
          type: array
          description: Permissions effectives, triées par ordre alphabétique.
          items:
            $ref: '#/components/schemas/Permission'
        bio:
          type: string
          maxLength: 1000
          nullable: true
        avatarUrl:
          type: string
          format: uri
          nullable: true
        website:
          type: string
          format: uri
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      example:
        id: 3f8a2b1c-4d5e-4f60-8a7b-9c0d1e2f3a4b
        email: gaby.martin@example.com
        name: Gaby Martin
        role: guest-author
        roles: [guest-author]
        permissions: ['media:upload', 'post:create', 'post:delete:own', 'post:submit', 'post:update:own']
        bio: Développeuse cloud, passionnée par le serverless.
        avatarUrl: https://d1a2b3c4d5e6f7.cloudfront.net/media/0192f4c3-4e5f-7a6b-8c7d-8e9f0a1b2c3d/avatar.webp
        website: https://gaby.example.com
        createdAt: '2026-10-19T18:22:10.000Z'
        updatedAt: '2026-10-21T07:45:00.000Z'
    ProfileUpdateRequest:
      type: object
      description: Champs du profil à modifier (au moins un).
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: Nouveau nom affiché.
        bio:
          type: string
          maxLength: 1000
          nullable: true
          description: Biographie (`null` pour l'effacer).
        avatarUrl:
          type: string
          format: uri
          maxLength: 2048
          nullable: true
          description: URL http(s) de l'avatar, par exemple l'`url` d'un média (`null` pour l'effacer).
        website:
          type: string
          format: uri
          maxLength: 2048
          nullable: true
          description: URL http(s) du site personnel (`null` pour l'effacer).
    PublicAuthor:
      type: object
      description: Profil public d'un auteur.
      required: [id, name, bio, avatarUrl, website]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        bio:
          type: string
          nullable: true
        avatarUrl:
          type: string
          format: uri
          nullable: true
        website:
          type: string
          format: uri
          nullable: true
      example:
        id: 3f8a2b1c-4d5e-4f60-8a7b-9c0d1e2f3a4b
        name: Gaby Martin
        bio: Développeuse cloud, passionnée par le serverless.
        avatarUrl: https://d1a2b3c4d5e6f7.cloudfront.net/media/0192f4c3-4e5f-7a6b-8c7d-8e9f0a1b2c3d/avatar.webp
        website: https://gaby.example.com
    CognitoUserStatus:
      type: string
      enum: [UNCONFIRMED, CONFIRMED, ARCHIVED, COMPROMISED, UNKNOWN, RESET_REQUIRED, FORCE_CHANGE_PASSWORD, EXTERNAL_PROVIDER]
      description: Statut du compte dans Amazon Cognito (`FORCE_CHANGE_PASSWORD` tant qu'un utilisateur invité n'a pas choisi son mot de passe).
      example: CONFIRMED
    AdminUser:
      type: object
      description: Compte utilisateur vu par un administrateur.
      required: [id, email, name, status, enabled, role, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          description: Identifiant de l'utilisateur (`sub` Cognito).
        email:
          type: string
          format: email
        name:
          type: string
        status:
          $ref: '#/components/schemas/CognitoUserStatus'
        enabled:
          type: boolean
          description: '`false` si le compte est désactivé (connexion impossible).'
        role:
          type: string
          enum: [admin, editor, guest-author, null]
          nullable: true
          description: Rôle principal, `null` pour un compte sans groupe.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      example:
        id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        email: eddie.durand@example.com
        name: Eddie Durand
        status: CONFIRMED
        enabled: true
        role: editor
        createdAt: '2026-10-18T11:00:00.000Z'
        updatedAt: '2026-10-18T11:05:00.000Z'
    AdminUserList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
        nextCursor:
          type: string
          nullable: true
          description: Curseur de la page suivante (`null` sur la dernière page).
    UserInviteRequest:
      type: object
      additionalProperties: false
      required: [email, name, role]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: Nom affiché.
        role:
          $ref: '#/components/schemas/Role'
      example:
        email: eddie.durand@example.com
        name: Eddie Durand
        role: editor
    UserUpdateRequest:
      type: object
      description: Modifications à appliquer (au moins un champ).
      additionalProperties: false
      minProperties: 1
      properties:
        role:
          $ref: '#/components/schemas/Role'
        enabled:
          type: boolean
          description: '`false` désactive le compte (et révoque ses sessions), `true` le réactive.'

    # ---------------------------------------------------------- Auth facade
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, name]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          $ref: '#/components/schemas/Password'
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: Nom affiché (signature des articles et commentaires).
      example:
        email: gaby.martin@example.com
        password: Blogify2026!
        name: Gaby Martin
    RegisterResponse:
      type: object
      required: [userId, email, name, role, confirmed, nextStep]
      properties:
        userId:
          type: string
          format: uuid
          description: Identifiant du compte (`sub` Cognito).
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [guest-author]
          description: Rôle attribué aux comptes créés par inscription.
        confirmed:
          type: boolean
          description: '`true` si le compte est déjà confirmé (mode démonstration).'
        nextStep:
          type: string
          enum: [LOGIN, CONFIRM_SIGN_UP]
          description: Étape suivante, `LOGIN` (`POST /auth/login`) ou `CONFIRM_SIGN_UP` (`POST /auth/confirm` avec le code reçu par e-mail).
    ConfirmRequest:
      type: object
      additionalProperties: false
      required: [email, code]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        code:
          type: string
          minLength: 1
          description: Code de vérification reçu par e-mail.
          example: '123456'
      example:
        email: gaby.martin@example.com
        code: '123456'
    ConfirmResponse:
      type: object
      required: [confirmed]
      properties:
        confirmed:
          type: boolean
          enum: [true]
      example:
        confirmed: true
    EmailRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          $ref: '#/components/schemas/Email'
      example:
        email: gaby.martin@example.com
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 256
          description: Mot de passe (ou mot de passe temporaire reçu par e-mail).
      example:
        email: gaby.martin@example.com
        password: Blogify2026!
    Tokens:
      type: object
      description: Jetons Amazon Cognito.
      required: [tokenType, idToken, accessToken, expiresIn]
      properties:
        tokenType:
          type: string
          enum: [Bearer]
        idToken:
          type: string
          description: '**Jeton à envoyer dans `Authorization: Bearer <idToken>`** (JWT, 60 minutes).'
        accessToken:
          type: string
          description: Access token Cognito (non accepté par cette API).
        refreshToken:
          type: string
          description: Jeton de renouvellement (30 jours), à conserver de façon sûre ; absent de la réponse de `POST /auth/refresh` lorsque Cognito n'en émet pas de nouveau.
        expiresIn:
          type: integer
          description: Durée de validité de l'ID token et de l'access token, en secondes.
          example: 3600
      example:
        tokenType: Bearer
        idToken: eyJraWQiOiJCazN4OFFtMlp0IiwiYWxnIjoiUlMyNTYifQ.eyJzdWIiOiIzZjhhMmIxYy00ZDVlLTRmNjAtOGE3Yi05YzBkMWUyZjNhNGIiLCJjb2duaXRvOmdyb3VwcyI6WyJndWVzdC1hdXRob3IiXSwiZW1haWwiOiJnYWJ5Lm1hcnRpbkBleGFtcGxlLmNvbSIsIm5hbWUiOiJHYWJ5IE1hcnRpbiIsInRva2VuX3VzZSI6ImlkIn0.aMM4sTmP7cTzXdIVYBa2Nt3yJoywkSL2WNC3LsDZy6M
        accessToken: eyJraWQiOiJRcDdyMkxtOVdkIiwiYWxnIjoiUlMyNTYifQ.eyJzdWIiOiIzZjhhMmIxYy00ZDVlLTRmNjAtOGE3Yi05YzBkMWUyZjNhNGIiLCJ0b2tlbl91c2UiOiJhY2Nlc3MiLCJzY29wZSI6ImF3cy5jb2duaXRvLnNpZ25pbi51c2VyLmFkbWluIn0.Nt3yJoywkSL2WNC3LsDZy6Mpaji0VGyCUcU2XaA2VZC
        refreshToken: eyJjdHkiOiJKV1QiLCJlbmMiOiJBMjU2R0NNIiwiYWxnIjoiUlNBLU9BRVAifQ.ZXhhbXBsZS1rZXk.ZXhhbXBsZS1pdg.ZXhhbXBsZS1jaXBoZXJ0ZXh0.ZXhhbXBsZS10YWc
        expiresIn: 3600
    NewPasswordChallenge:
      type: object
      description: Défi renvoyé à la première connexion d'un compte créé par un administrateur.
      required: [challenge, session]
      properties:
        challenge:
          type: string
          enum: [NEW_PASSWORD_REQUIRED]
        session:
          type: string
          description: Session du défi, à renvoyer à `POST /auth/new-password` (valable quelques minutes).
    RefreshTokenRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 1
          description: Refresh token reçu à la connexion.
      example:
        refreshToken: eyJjdHkiOiJKV1QiLCJlbmMiOiJBMjU2R0NNIiwiYWxnIjoiUlNBLU9BRVAifQ.ZXhhbXBsZS1rZXk.ZXhhbXBsZS1pdg.ZXhhbXBsZS1jaXBoZXJ0ZXh0.ZXhhbXBsZS10YWc
    NewPasswordRequest:
      type: object
      additionalProperties: false
      required: [email, newPassword, session]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        newPassword:
          $ref: '#/components/schemas/Password'
        session:
          type: string
          minLength: 1
