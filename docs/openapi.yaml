                  $ref: '#/components/examples/InvalidPassword'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '5XX':
          $ref: '#/components/responses/ServerError'

  /auth/logout:
    post:
      tags: [Authentification]
      operationId: logout
      summary: Se déconnecter
      description: >-
        Révoque le refresh token ainsi que les access tokens émis à partir de celui-ci. Les ID tokens déjà émis restent acceptés jusqu'à leur expiration (60 minutes au plus) : supprimez-les côté client.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '204':
          description: Session révoquée.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidRefreshToken'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '5XX':
          $ref: '#/components/responses/ServerError'

  # ---------------------------------------------------------------------------
