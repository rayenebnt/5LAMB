  /posts/{postId}:
    get:
      tags: [Articles]
      operationId: getPost
      summary: Lire un article (par identifiant ou slug)
      description: |-
        Renvoie un article complet, avec son contenu Markdown, à partir de son identifiant **ou de son slug**.

        Un article non publié n'est visible que de son auteur et des éditeurs et administrateurs : pour tout autre appelant (anonyme compris), la réponse est `404`. L'en-tête `ETag` contient la version courante, à renvoyer dans `If-Match` lors d'une modification. Un article publié lu anonymement est cachable.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostIdOrSlug'
      responses:
        '200':
          description: Article complet.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Vary:
              description: '`Authorization` (article publié uniquement), afin qu''un cache ne serve pas une réponse anonyme à un appelant authentifié.'
              schema:
                type: string
                example: Authorization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '5XX':
          $ref: '#/components/responses/ServerError'
    patch:
      tags: [Articles]
      operationId: updatePost
      summary: Modifier un article
      description: |-
        Modifie partiellement un article (au moins un champ). `excerpt: null` rétablit le résumé automatique et `coverImageUrl: null` supprime l'image de couverture ; un nouveau `slug` libère l'ancien. Le statut ne se modifie pas ici : utilisez les routes du workflow éditorial.

        - L'auteur (`post:update:own`) peut modifier son article tant qu'il est `draft` ou `in_review` (sinon `403`).
        - Les éditeurs et administrateurs (`post:update:any`) peuvent modifier tout article, quel que soit son statut.

        Envoyez `If-Match` (valeur de l'`ETag`) pour ne pas écraser une modification concurrente (`412`). Sans `If-Match`, un conflit d'écriture simultanée est retenté une fois puis signalé par `409 CONFLICT`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostUpdateRequest'
            examples:
              content:
                summary: Modifier le contenu et les tags
                value:
                  content: "# Introduction\n\nUne API **serverless** repose sur trois services : API Gateway, Lambda et DynamoDB."
                  tags: [aws, serverless, dynamodb]
              resetExcerpt:
                summary: Revenir au résumé automatique
                value:
                  excerpt: null
      responses:
        '200':
          description: Article modifié (version incrémentée).
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Slug déjà utilisé (`SLUG_TAKEN`), ou modification concurrente (`CONFLICT`) persistante sans `If-Match` ou en cours au même moment ; relisez l'article puis réessayez.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                slugTaken:
                  summary: Slug déjà utilisé
                  value:
                    error:
                      code: SLUG_TAKEN
                      message: The slug 'architecture-serverless' is already used by another post
                    requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
                concurrentUpdate:
                  summary: Écritures simultanées
                  value:
                    error:
                      code: CONFLICT
                      message: The post was modified by another request, please retry
                    requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '5XX':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [Articles]
      operationId: deletePost
      summary: Supprimer un article
      description: |-
        Supprime définitivement un article et libère son slug. Ses commentaires, ses entrées d'index de recherche et ses tags sont supprimés de façon asynchrone.

        - L'auteur (`post:delete:own`) peut supprimer son article tant qu'il est `draft` ou `in_review` (sinon `403`).
        - Les éditeurs et administrateurs (`post:delete:any`) peuvent supprimer tout article.

        `If-Match` est facultatif (suppression refusée avec `412` si l'article a changé depuis sa lecture). Sans `If-Match`, une écriture concurrente est retentée une fois, puis signalée par `409 CONFLICT`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostId'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Article supprimé.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Modification concurrente (`CONFLICT`) persistante sans `If-Match` ou en cours au même moment ; relisez l'article puis réessayez.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: CONFLICT
                  message: The post was modified by another request, please retry
                requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '5XX':
          $ref: '#/components/responses/ServerError'

