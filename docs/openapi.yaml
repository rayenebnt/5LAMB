  /media:
    post:
      tags: [Médias]
      operationId: requestMediaUpload
      summary: Demander le téléversement d'un média
      description: |-
        Première étape du téléversement (voir « Téléversement des médias » en introduction) : enregistre le média au statut `pending` et renvoie dans `upload` une autorisation de téléversement **direct vers Amazon S3** (presigned POST, valable 15 minutes).

        Envoyez ensuite le fichier dans une requête `multipart/form-data` vers `upload.url`, avec **tous** les champs de `upload.fields` suivis du fichier dans le champ `file` :

        ```bash
        curl -X POST "<upload.url>" -F "key=<fields.key>" -F "Policy=<fields.Policy>" … -F "file=@schema-architecture.png"
        ```

        S3 répond `204 No Content`. Le fichier est ensuite validé de façon asynchrone (type réel, taille, signature binaire) : interrogez `GET /media/{mediaId}` jusqu'au statut `ready` (URL disponible) ou `rejected`.

        Permission `media:upload` (tous les rôles).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaUploadRequest'
            example:
              filename: Schéma architecture.PNG
              contentType: image/png
              size: 48213
              altText: Schéma de l'architecture serverless
      responses:
        '201':
          description: Média enregistré (`pending`) et autorisation de téléversement.
          headers:
            Location:
              description: Chemin du média créé (`GET /media/{mediaId}`), relatif à l'hôte de l'API, préfixe de déploiement compris.
              schema:
                type: string
                example: /dev/media/0192f4c2-3d4e-7f5a-8b6c-7d8e9f0a1b2c
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaUpload'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          description: Taille déclarée (`size`) supérieure à la limite de son type (10 Mio par défaut pour une image, 200 Mio pour une vidéo), ou corps de requête trop volumineux (`PAYLOAD_TOO_LARGE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: PAYLOAD_TOO_LARGE
                  message: The maximum size of image files is 10 MB (10485760 bytes)
                requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
        '415':
          description: Type de fichier non pris en charge (SVG, PDF…), ou corps de requête qui n'est pas en JSON (`UNSUPPORTED_MEDIA_TYPE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: UNSUPPORTED_MEDIA_TYPE
                  message: "Unsupported content type 'image/svg+xml' (accepted: image/jpeg, image/png, image/gif, image/webp, image/avif, video/mp4, video/webm, video/quicktime)"
                requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '5XX':
          $ref: '#/components/responses/ServerError'
