      description: |-
        Publie un article `draft`, `in_review` ou `archived` : il devient visible publiquement. `publishedAt` est fixé lors de la première publication (et conservé lors d'une republication) ; la note de relecture (`reviewNote`) est effacée.

        Quelques secondes plus tard, de façon asynchrone : l'article est indexé (recherche, tags), les abonnés à la newsletter sont notifiés par e-mail (une seule fois par article) et un événement `PostPublished` est émis sur Amazon EventBridge.

