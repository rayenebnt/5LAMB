        Les modérateurs (permission `comment:moderate` : éditeurs et administrateurs) reçoivent toujours la représentation de modération (`ModeratorComment`) et peuvent demander un autre statut (`pending`, `rejected`, `spam` ou `all`) ; pour tout autre appelant, un tel statut donne `401` sans jeton et `403` avec un jeton.
