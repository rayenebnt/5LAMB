          description: Mot de passe modifié ; l'utilisateur peut se connecter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Password has been reset, you can now log in.
        '400':
          description: Données invalides (`VALIDATION_ERROR`), code incorrect (`INVALID_CODE`) ou expiré (`EXPIRED_CODE`), mot de passe refusé par la politique Cognito (`INVALID_PASSWORD`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCode:
                  $ref: '#/components/examples/InvalidCode'
                expiredCode:
                  $ref: '#/components/examples/ExpiredCode'
