        title:
          type: string
          maxLength: 200
        excerpt:
          type: string
          maxLength: 500
          description: Résumé fourni par l'auteur, ou généré à partir du contenu (200 caractères au plus).
        coverImageUrl:
          type: string
          format: uri
          nullable: true
          description: URL de l'image de couverture.
        tags:
          type: array
          maxItems: 10
          description: Tags normalisés (minuscules, sans accents, mots séparés par des tirets).
