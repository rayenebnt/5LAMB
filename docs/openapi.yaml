    post:
      tags: [Commentaires]
      operationId: createComment
      summary: Commenter un article
      description: |-
        Ajoute un commentaire à un article publié dont les commentaires sont ouverts (`allowComments`). L'article doit encore être publié au moment de l'écriture : un article inexistant, non publié, ou supprimé ou dépublié au même moment donne `404`.

        - **Anonyme** : `authorName` est obligatoire et `authorEmail` facultatif (jamais affiché publiquement).
        - **Connecté** (jeton facultatif) : le nom et l'e-mail du compte sont utilisés (`authorName` et `authorEmail` sont ignorés).
        - Seuls les commentaires des modérateurs (éditeurs et administrateurs) sont approuvés immédiatement (`approved`) ; tous les autres (lecteurs anonymes, auteurs invités, comptes sans rôle) attendent une modération (`pending`).

        `parentId` permet de répondre à un commentaire approuvé du même article. Le champ `website` doit rester vide (champ anti-spam à masquer dans les formulaires) : rempli, il fait classer le commentaire en spam, avec la même réponse qu'un commentaire en attente. Lorsque DynamoDB limite les écritures, la réponse est `503 SERVICE_UNAVAILABLE` avec `Retry-After`. Limite de débit renforcée (5 requêtes/s).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentCreateRequest'
            examples:
              anonymous:
                summary: Commentaire anonyme (modéré)
                value:
                  body: Très clair, merci pour le schéma d'architecture !
                  authorName: Lectrice
                  authorEmail: lectrice@example.com
              reply:
                summary: Réponse d'un utilisateur connecté
                value:
                  body: Merci ! Le code source complet est dans le dépôt.
                  parentId: 0192f4b0-1a2b-7c3d-8e4f-5a6b7c8d9e0f
      responses:
        '201':
          description: Commentaire enregistré (`approved` pour un modérateur, `pending` sinon).
          headers:
            Location:
              description: Chemin du commentaire créé (`/posts/{postId}/comments/{commentId}`), relatif à l'hôte de l'API, préfixe de déploiement compris.
              schema:
                type: string
                example: /dev/posts/0192f4a0-5b1c-7d2e-8f3a-4b5c6d7e8f90/comments/0192f4b0-1a2b-7c3d-8e4f-5a6b7c8d9e0f
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
              examples:
                pending:
                  summary: Commentaire anonyme en attente de modération
                  value:
                    id: 0192f4b0-1a2b-7c3d-8e4f-5a6b7c8d9e0f
                    postId: 0192f4a0-5b1c-7d2e-8f3a-4b5c6d7e8f90
                    parentId: null
                    body: Très clair, merci pour le schéma d'architecture !
                    author:
                      id: null
                      name: Lectrice
                    status: pending
                    createdAt: '2026-10-23T10:12:45.000Z'
                memberPending:
                  summary: Réponse d'un auteur invité connecté, en attente de modération
                  value:
                    id: 0192f4b1-2c3d-7e4f-9a5b-6c7d8e9f0a1b
                    postId: 0192f4a0-5b1c-7d2e-8f3a-4b5c6d7e8f90
                    parentId: 0192f4b0-1a2b-7c3d-8e4f-5a6b7c8d9e0f
                    body: Merci ! Le code source complet est dans le dépôt.
                    author:
                      id: 3f8a2b1c-4d5e-4f60-8a7b-9c0d1e2f3a4b
                      name: Gaby Martin
                    status: pending
                    createdAt: '2026-10-23T11:02:10.000Z'
                approved:
                  summary: Commentaire d'un éditeur, approuvé d'office
                  value:
                    id: 0192f4b2-3d4e-7f5a-8b6c-7d8e9f0a1b2c
                    postId: 0192f4a0-5b1c-7d2e-8f3a-4b5c6d7e8f90
