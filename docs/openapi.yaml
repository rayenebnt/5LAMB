# OpenAPI description of the Blogify REST API.
# Source of truth for the API contract: scripts/build.mjs converts it to dist/docs/openapi.json,
# served by GET /openapi.json and rendered by Swagger UI on GET /docs.
# tests/unit/template.test.mjs checks that it documents exactly the routes of template.yaml (with
# their security, an operationId and a summary); tests/unit/docs.test.mjs checks that every $ref
# resolves. No test validates the examples against their schemas: check them when editing.
openapi: '3.0.3'
info:
  title: Blogify API
  version: '1.0.0'
  license:
    name: MIT
  description: |-
    **Blogify** est une plateforme de blogging *headless* 100 % serverless : cette API REST (Amazon API Gateway + AWS Lambda) gère les articles et leur workflow éditorial, les commentaires, la médiathèque, la recherche plein texte, la newsletter et les comptes utilisateurs. Les données sont stockées dans Amazon DynamoDB, les fichiers dans Amazon S3 (diffusés par Amazon CloudFront) et les identités dans Amazon Cognito.

    ## Authentification

    1. Créez un compte avec `POST /auth/register` (rôle `guest-author`), puis connectez-vous avec `POST /auth/login`.
    2. Envoyez le **jeton d'identité Cognito** (`idToken`, et non l'`accessToken`) dans l'en-tête `Authorization: Bearer <idToken>`. Il est valable 60 minutes : renouvelez-le avec `POST /auth/refresh` (refresh token valable 30 jours) et révoquez la session avec `POST /auth/logout`.
    3. Les routes protégées (cadenas) sont contrôlées par un authorizer Lambda qui vérifie la signature, l'expiration, l'émetteur, l'audience et `token_use = id` du jeton : jeton absent, invalide ou expiré → `401 UNAUTHORIZED`. API Gateway met le résultat de ce contrôle en cache **300 secondes** par jeton : un jeton déjà accepté le reste sur les routes protégées jusqu'à 5 minutes après son expiration.
    4. Certaines routes publiques acceptent un jeton **facultatif** qui personnalise la réponse (brouillons visibles par leur auteur, commentaires en attente visibles des modérateurs…) ; un jeton fourni mais invalide ou expiré y est refusé (`401 UNAUTHORIZED`), sans délai de cache.

    La désactivation d'un compte ou un changement de rôle ne révoque pas les ID tokens déjà émis : ils restent acceptés jusqu'à leur expiration (60 minutes au plus, plus le cache de 300 secondes sur les routes protégées) avec les rôles qu'ils contiennent. Les routes d'administration (`/users`) revérifient donc à chaque appel, dans Amazon Cognito, que l'appelant est toujours un administrateur actif (`403 FORBIDDEN` sinon).

    Si les clés publiques de Cognito ne peuvent pas être téléchargées, une route à jeton facultatif appelée avec un jeton répond `503 SERVICE_UNAVAILABLE` (avec `Retry-After: 1`) et une route protégée `500` (`AUTHORIZER_FAILURE`, réponse d'API Gateway) : réessayez sans abandonner la session.

    Sur cette page, cliquez sur **Authorize** et collez l'`idToken` (sans le préfixe `Bearer`).

    ## Rôles et permissions

    Les rôles sont des groupes Amazon Cognito, transmis dans le claim `cognito:groups` de l'ID token :

    | Rôle | Peut… |
    |---|---|
    | `admin` | tout faire, y compris gérer les comptes et les rôles (`/users`) et consulter les abonnés à la newsletter |
    | `editor` | lire, modifier, publier, rejeter, archiver et supprimer **tous** les articles ; modérer les commentaires ; gérer toute la médiathèque |
    | `guest-author` | créer ses propres articles, les modifier ou les supprimer tant qu'ils sont en brouillon ou en relecture, les soumettre à relecture ; téléverser des médias |

    Les nouveaux inscrits sont `guest-author`. Un compte sans groupe (incident lors de l'inscription, compte créé hors de l'API) est authentifié mais n'a aucun droit d'écriture ; `POST /auth/login` lui attribue le rôle `guest-author`. Seuls les commentaires des éditeurs et administrateurs sont publiés sans modération. Un changement de rôle prend effet au prochain renouvellement du jeton. Permission manquante → `403 FORBIDDEN` ; une ressource que l'appelant n'a pas le droit de voir (brouillon d'un autre auteur, média en attente…) est signalée comme inexistante (`404 NOT_FOUND`) afin de ne pas révéler son existence.

    ## Pagination

    Les listes renvoient `{ "items": [...], "nextCursor": "..." }`. Pour obtenir la page suivante, renvoyez la valeur de `nextCursor` dans le paramètre `cursor` (avec les mêmes filtres) ; `nextCursor` vaut `null` sur la dernière page. Le curseur est **opaque** : ne le construisez pas et ne le modifiez pas (curseur invalide → `400 BAD_REQUEST`). La taille des pages se règle avec `limit` ; une page peut contenir moins de `limit` éléments sans être la dernière : seul `nextCursor` indique la fin de la liste.

    ## Format des erreurs

    Toutes les erreurs, qu'elles proviennent des fonctions Lambda ou d'API Gateway, ont la même forme :

    ```json
    {
      "error": {
        "code": "VALIDATION_ERROR",
        "message": "Request validation failed",
        "details": [{ "field": "title", "message": "Title is required" }]
      },
      "requestId": "c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e"
    }
    ```

    `code` est stable et destiné aux programmes, `message` (en anglais) aux développeurs ; `details` n'est présent que pour les erreurs de validation ; `requestId` identifie la requête dans les journaux. Les entrées sont validées strictement et refusées avec `400 VALIDATION_ERROR` : champ inconnu dans un corps JSON, paramètre de requête inconnu sur les listes, la recherche et `GET /tags` (un paramètre anti-cache `_=…` compris), identifiant mal formé dans le chemin (un UUID est attendu, sauf pour `GET /posts/{postId}` qui accepte aussi un slug). Les erreurs inattendues ne révèlent jamais de détail interne.

    | HTTP | Codes |
    |---|---|
    | 400 | `VALIDATION_ERROR`, `BAD_REQUEST`, `INVALID_PARENT`, `INVALID_PASSWORD`, `INVALID_PARAMETER`, `INVALID_CODE`, `EXPIRED_CODE` |
    | 401 | `UNAUTHORIZED`, `INVALID_CREDENTIALS`, `INVALID_TOKEN` |
    | 403 | `FORBIDDEN`, `COMMENTS_DISABLED`, `USER_NOT_CONFIRMED`, `PASSWORD_RESET_REQUIRED` |
    | 404 | `NOT_FOUND`, `ROUTE_NOT_FOUND` |
    | 409 | `CONFLICT`, `SLUG_TAKEN`, `INVALID_STATE_TRANSITION`, `USER_EXISTS`, `SELF_MODIFICATION`, `TAG_SUBSCRIPTIONS_FULL` |
    | 412 | `PRECONDITION_FAILED` |
    | 413 | `PAYLOAD_TOO_LARGE` |
    | 415 | `UNSUPPORTED_MEDIA_TYPE` |
    | 429 | `TOO_MANY_REQUESTS` |
    | 500 | `INTERNAL_ERROR` |
    | 501 | `UNSUPPORTED_CHALLENGE` (défi Cognito non géré par l'API, par exemple MFA) |
    | 503 | `SERVICE_UNAVAILABLE` (avec l'en-tête `Retry-After`) |

    Les erreurs produites par API Gateway lui-même (authorizer, limites de débit, route inconnue…) ont la même forme : `UNAUTHORIZED`, `FORBIDDEN`, `ROUTE_NOT_FOUND` ou `TOO_MANY_REQUESTS`, et sinon le type de réponse de la passerelle, par exemple `AUTHORIZER_FAILURE` (500), `INTEGRATION_TIMEOUT` (504) ou `REQUEST_TOO_LARGE` (413, corps de plus de 10 Mo).

    ## Concurrence optimiste (ETag / If-Match)

    Chaque article porte un numéro de `version`, incrémenté à chaque modification et renvoyé dans l'en-tête `ETag` (`"v3"`). Renvoyez cette valeur dans l'en-tête `If-Match` de `PATCH /posts/{postId}`, `DELETE /posts/{postId}` et des transitions du workflow : si l'article a été modifié entre-temps, la requête est refusée (`412 PRECONDITION_FAILED`) au lieu d'écraser le travail d'un autre utilisateur ; relisez l'article puis réessayez. Sans `If-Match`, une écriture concurrente est retentée automatiquement une fois, puis signalée par `409 CONFLICT`.

    ## Téléversement des médias (presigned POST)

    Les fichiers ne transitent pas par l'API : ils sont envoyés directement à Amazon S3.

    1. `POST /media` avec `filename`, `contentType` et `size` (en octets) : le média est créé au statut `pending` et la réponse contient une autorisation de téléversement `upload` (URL et champs signés, valable 15 minutes).
    2. Envoyez une requête `POST` `multipart/form-data` vers `upload.url` contenant tous les champs de `upload.fields`, puis le fichier dans un dernier champ `file`. S3 répond `204 No Content`. Le fichier doit avoir le `Content-Type` déclaré et ne pas dépasser la taille déclarée (`size`).
    3. Le fichier est vérifié de façon asynchrone (type, taille et signature binaire réels) : le média passe à `ready` (son `url` devient disponible) ou à `rejected` (`rejectionReason`, fichier supprimé). Interrogez `GET /media/{mediaId}` pour suivre son statut.

    Amazon CloudFront ne diffuse que les fichiers validés par cette vérification, et l'`url` CloudFront d'un média `ready` est permanente (sans CDN, `url` est une URL S3 présignée temporaire). Tant que l'autorisation de téléversement n'a pas expiré, un nouvel envoi remplace le fichier, qui est alors vérifié de nouveau (un contenu invalide fait passer le média à `rejected`).

    Formats acceptés : JPEG, PNG, GIF, WebP et AVIF (10 Mio maximum par défaut), MP4, WebM et QuickTime (200 Mio maximum par défaut). Le SVG est refusé (risque de XSS). Un média jamais téléversé est purgé automatiquement après 24 heures, un média refusé après 7 jours.

    ## Cohérence à terme

    L'API lit DynamoDB en cohérence à terme : une écriture confirmée apparaît généralement en moins d'une seconde dans les lectures suivantes, en particulier dans les listes servies par des index secondaires (`GET /posts`, `GET /comments`, `GET /media`). Les écritures, elles, partent toujours de l'état courant (lecture fortement cohérente, puis écriture conditionnelle).

    Certaines vues sont en outre des projections mises à jour **de façon asynchrone** (DynamoDB Streams), généralement en moins d'une seconde : la recherche (`GET /search`), les tags (`GET /tags`) et la liste par tag (`GET /posts?tag=…`, y compris le `commentCount` et la `version` des articles listés). Il en va de même de la suppression des commentaires d'un article supprimé, de l'envoi de la newsletter (Amazon SNS) et de l'événement `PostPublished` (Amazon EventBridge).

    ## Limites de débit et cache

    API Gateway limite le débit à 100 requêtes/s (rafales de 200), avec des limites plus strictes sur les routes exposées aux abus (`POST /auth/register`, `POST /auth/login`, `POST /auth/forgot-password`, `POST /posts/{postId}/comments`, `POST /subscriptions`) : au-delà → `429 TOO_MANY_REQUESTS`.

    Les lectures publiques anonymes sont cachables (`Cache-Control: public, max-age=60, stale-while-revalidate=300` ; durées plus longues pour `GET /tags`, `GET /docs` et `GET /openapi.json`) ; les réponses personnalisées ou non publiques sont marquées `private, no-store`. La plupart des lectures portent `Vary: Authorization`, afin qu'un cache ne serve pas une réponse anonyme à un appelant authentifié. Les réponses contenant des jetons portent `Cache-Control: no-store` et `Pragma: no-cache`.

    ## Conventions

    JSON en UTF-8 (`Content-Type: application/json` obligatoire pour les corps de requête, 1 Mio maximum), champs en camelCase, dates ISO 8601 en UTC, identifiants UUID (v7, triables chronologiquement, pour les articles, commentaires et médias ; `sub` Cognito pour les utilisateurs). Création → `201 Created` avec l'en-tête `Location`, chemin de la ressource créée relatif à l'hôte de l'API et préfixe de déploiement compris (par exemple `/dev/posts/{id}` sur l'URL `execute-api`, où `dev` est le stage) ; suppression → `204 No Content`. Les noms affichés (auteurs, commentaires, médias) ne sont jamais dérivés d'une adresse e-mail : à défaut de nom, l'API utilise `Anonymous`. CORS : en-têtes `Content-Type`, `Authorization` et `If-Match` autorisés ; `ETag` et `Location` exposés.

servers:
  - url: 'https://{apiId}.execute-api.{region}.amazonaws.com/{stage}'
    description: 'API Gateway (dans GET /openapi.json, remplacé par l''URL réellement appelée)'
    variables:
      apiId:
        default: abcdef1234
        description: Identifiant de l'API REST (voir la sortie ApiUrl de la pile CloudFormation)
      region:
        default: eu-west-3
        description: Région AWS du déploiement
      stage:
        default: dev
        description: Stage API Gateway (paramètre Stage du template SAM)
  - url: 'http://127.0.0.1:3000'
    description: Exécution locale (sam local start-api)

# Secure by default, like the API Gateway DefaultAuthorizer; every operation also states its own security.
security:
  - bearerAuth: []

tags:
  - name: Authentification
    description: Inscription, connexion, jetons et mots de passe (façade sur Amazon Cognito). Routes publiques.
  - name: Profils
    description: Profil de l'utilisateur connecté et profils publics des auteurs.
  - name: Utilisateurs
    description: Administration des comptes et des rôles (administrateurs).
  - name: Articles
    description: Lecture publique des articles (API de diffusion) et rédaction.
  - name: Workflow éditorial
    description: |-
      Transitions de statut d'un article. Chaque transition n'est possible que depuis certains statuts (sinon `409 INVALID_STATE_TRANSITION`) :

      | Action | Depuis | Vers | Qui |
      |---|---|---|---|
      | `submit` | `draft` | `in_review` | l'auteur, ou un éditeur / administrateur |
      | `publish` | `draft`, `in_review`, `archived` | `published` | éditeur / administrateur |
      | `unpublish` | `published` | `draft` | éditeur / administrateur |
      | `reject` | `in_review` | `draft` | éditeur / administrateur |
      | `archive` | `draft`, `in_review`, `published` | `archived` | éditeur / administrateur |

      Toutes les transitions acceptent l'en-tête `If-Match` et renvoient l'article complet avec son nouvel `ETag`.
  - name: Commentaires
    description: Commentaires des lecteurs (anonymes ou connectés) et modération.
  - name: Médias
    description: Médiathèque (images et vidéos) avec téléversement direct vers Amazon S3 et validation asynchrone.
  - name: Recherche
    description: Recherche plein texte et tags des articles publiés (index mis à jour de façon asynchrone).
  - name: Newsletter
    description: Abonnement par e-mail aux nouveaux articles (Amazon SNS, double opt-in).
  - name: Système
    description: Documentation interactive, document OpenAPI et supervision.

paths:
  # ---------------------------------------------------------------------------
  # Authentification (AuthFunction) - public routes
  # ---------------------------------------------------------------------------
  /auth/register:
    post:
      tags: [Authentification]
      operationId: register
      summary: Créer un compte (auteur invité)
      description: |-
        Crée un compte Amazon Cognito avec le rôle `guest-author` (auteur invité) ainsi que son profil public, désigné par l'en-tête `Location` (`GET /authors/{userId}`).

        - En mode démonstration (paramètre de déploiement `AutoConfirmUsers=true`), le compte est confirmé immédiatement : `confirmed: true`, `nextStep: LOGIN`.
        - Sinon, Cognito envoie un code de vérification par e-mail : `confirmed: false`, `nextStep: CONFIRM_SIGN_UP` (voir `POST /auth/confirm`).

        Limite de débit renforcée (5 requêtes/s).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Compte créé.
          headers:
            Location:
              description: Chemin du profil public du compte (`GET /authors/{userId}`), relatif à l'hôte de l'API, préfixe de déploiement compris.
              schema:
                type: string
                example: /dev/authors/3f8a2b1c-4d5e-4f60-8a7b-9c0d1e2f3a4b
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
              examples:
                autoConfirmed:
                  summary: Compte confirmé automatiquement (mode démonstration)
                  value:
                    userId: 3f8a2b1c-4d5e-4f60-8a7b-9c0d1e2f3a4b
                    email: gaby.martin@example.com
                    name: Gaby Martin
                    role: guest-author
                    confirmed: true
                    nextStep: LOGIN
                confirmationRequired:
                  summary: Confirmation par e-mail requise
                  value:
                    userId: 3f8a2b1c-4d5e-4f60-8a7b-9c0d1e2f3a4b
                    email: gaby.martin@example.com
                    name: Gaby Martin
                    role: guest-author
                    confirmed: false
                    nextStep: CONFIRM_SIGN_UP
        '400':
          description: Données invalides (`VALIDATION_ERROR`), mot de passe refusé par la politique Cognito (`INVALID_PASSWORD`) ou paramètre refusé par Cognito (`INVALID_PARAMETER`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidEmail:
                  $ref: '#/components/examples/InvalidEmail'
                invalidPassword:
                  $ref: '#/components/examples/InvalidPassword'
        '409':
          $ref: '#/components/responses/UserExists'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '5XX':
          $ref: '#/components/responses/ServerError'

  /auth/confirm:
    post:
      tags: [Authentification]
      operationId: confirmRegistration
      summary: Confirmer l'inscription
      description: Confirme un compte avec le code reçu par e-mail après l'inscription (inutile lorsque les comptes sont confirmés automatiquement).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmRequest'
      responses:
        '200':
          description: Compte confirmé ; l'utilisateur peut se connecter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmResponse'
        '400':
          description: Données invalides (`VALIDATION_ERROR`), code incorrect (`INVALID_CODE`, également renvoyé pour un compte inconnu afin de ne pas révéler les adresses inscrites) ou expiré (`EXPIRED_CODE`, demander un nouveau code avec `POST /auth/resend-code`), paramètre refusé par Cognito (`INVALID_PARAMETER`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCode:
                  $ref: '#/components/examples/InvalidCode'
                expiredCode:
                  $ref: '#/components/examples/ExpiredCode'
        '401':
          description: Confirmation refusée par Cognito pour ce compte, par exemple un compte déjà confirmé (`INVALID_CREDENTIALS`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: INVALID_CREDENTIALS
                  message: This operation is not allowed for this account
                requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '5XX':
          $ref: '#/components/responses/ServerError'

  /auth/resend-code:
    post:
      tags: [Authentification]
      operationId: resendConfirmationCode
      summary: Renvoyer le code de confirmation
      description: |-
        Renvoie par e-mail le code de confirmation d'inscription.

        La réponse est **toujours** `202`, que le compte existe, attende sa confirmation ou soit déjà confirmé, afin de ne pas permettre l'énumération des comptes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          description: Demande prise en compte ; un code n'est envoyé que si le compte existe et attend sa confirmation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: If the account exists and is awaiting confirmation, a new verification code has been e-mailed
        '400':
          description: E-mail invalide (`VALIDATION_ERROR`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidEmail:
                  $ref: '#/components/examples/InvalidEmail'
        '401':
          $ref: '#/components/responses/AccountOperationRefused'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '5XX':
          $ref: '#/components/responses/ServerError'

  /auth/login:
    post:
      tags: [Authentification]
      operationId: login
      summary: Se connecter
      description: |-
        Authentifie l'utilisateur (flux Cognito `USER_PASSWORD_AUTH`) et renvoie ses jetons. Utilisez **`idToken`** dans l'en-tête `Authorization: Bearer <idToken>` des routes protégées.

        - Tout mot de passe non vide (256 caractères au plus) est transmis à Cognito : la politique de mot de passe n'est pas appliquée à la connexion, et un mot de passe incorrect donne `401 INVALID_CREDENTIALS`.
        - À la première connexion d'un compte créé par un administrateur (mot de passe temporaire reçu par e-mail), la réponse est le défi `NEW_PASSWORD_REQUIRED` accompagné d'une `session` : terminez la connexion avec `POST /auth/new-password`.
        - Un compte qui n'a encore aucun rôle reçoit `guest-author` lors de la connexion ; les jetons renvoyés le contiennent déjà (sans action du client).

        La réponse n'est jamais mise en cache (`Cache-Control: no-store`, `Pragma: no-cache`). Limite de débit renforcée (10 requêtes/s).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Connexion réussie (jetons) ou nouveau mot de passe exigé (défi).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Pragma:
              $ref: '#/components/headers/Pragma'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Tokens'
                  - $ref: '#/components/schemas/NewPasswordChallenge'
              examples:
                tokens:
                  summary: Connexion réussie
                  value:
                    tokenType: Bearer
                    idToken: eyJraWQiOiJCazN4OFFtMlp0IiwiYWxnIjoiUlMyNTYifQ.eyJzdWIiOiIzZjhhMmIxYy00ZDVlLTRmNjAtOGE3Yi05YzBkMWUyZjNhNGIiLCJjb2duaXRvOmdyb3VwcyI6WyJndWVzdC1hdXRob3IiXSwiZW1haWwiOiJnYWJ5Lm1hcnRpbkBleGFtcGxlLmNvbSIsIm5hbWUiOiJHYWJ5IE1hcnRpbiIsInRva2VuX3VzZSI6ImlkIn0.aMM4sTmP7cTzXdIVYBa2Nt3yJoywkSL2WNC3LsDZy6M
                    accessToken: eyJraWQiOiJRcDdyMkxtOVdkIiwiYWxnIjoiUlMyNTYifQ.eyJzdWIiOiIzZjhhMmIxYy00ZDVlLTRmNjAtOGE3Yi05YzBkMWUyZjNhNGIiLCJ0b2tlbl91c2UiOiJhY2Nlc3MiLCJzY29wZSI6ImF3cy5jb2duaXRvLnNpZ25pbi51c2VyLmFkbWluIn0.Nt3yJoywkSL2WNC3LsDZy6Mpaji0VGyCUcU2XaA2VZC
                    refreshToken: eyJjdHkiOiJKV1QiLCJlbmMiOiJBMjU2R0NNIiwiYWxnIjoiUlNBLU9BRVAifQ.ZXhhbXBsZS1rZXk.ZXhhbXBsZS1pdg.ZXhhbXBsZS1jaXBoZXJ0ZXh0.ZXhhbXBsZS10YWc
                    expiresIn: 3600
                newPasswordRequired:
                  summary: Première connexion avec un mot de passe temporaire
                  value:
                    challenge: NEW_PASSWORD_REQUIRED
                    session: AYABeEXAMPLEsessionTokenReturnedByCognito
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: E-mail ou mot de passe incorrect, ou compte désactivé (`INVALID_CREDENTIALS`). Le message ne permet pas de savoir si le compte existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: INVALID_CREDENTIALS
                  message: Incorrect e-mail address or password
                requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
        '403':
          description: Compte non confirmé (`USER_NOT_CONFIRMED`, voir `POST /auth/confirm`) ou réinitialisation du mot de passe exigée (`PASSWORD_RESET_REQUIRED`, voir `POST /auth/forgot-password`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notConfirmed:
                  summary: Compte non confirmé
                  value:
                    error:
                      code: USER_NOT_CONFIRMED
                      message: The account has not been confirmed yet (see the e-mailed code)
                    requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
                passwordResetRequired:
                  summary: Réinitialisation du mot de passe exigée
                  value:
                    error:
                      code: PASSWORD_RESET_REQUIRED
                      message: A password reset is required for this account
                    requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '501':
          $ref: '#/components/responses/UnsupportedChallenge'
        '5XX':
          $ref: '#/components/responses/ServerError'

  /auth/refresh:
    post:
      tags: [Authentification]
      operationId: refreshTokens
      summary: Renouveler les jetons
      description: Obtient un nouvel ID token et un nouvel access token à partir du refresh token (valable 30 jours) ; ils portent les rôles actuels du compte. Le refresh token n'est renvoyé que si Cognito en émet un nouveau ; sinon, conservez celui reçu à la connexion. La réponse n'est jamais mise en cache.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Nouveaux jetons.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Pragma:
              $ref: '#/components/headers/Pragma'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
              example:
                tokenType: Bearer
                idToken: eyJraWQiOiJCazN4OFFtMlp0IiwiYWxnIjoiUlMyNTYifQ.eyJzdWIiOiIzZjhhMmIxYy00ZDVlLTRmNjAtOGE3Yi05YzBkMWUyZjNhNGIiLCJjb2duaXRvOmdyb3VwcyI6WyJndWVzdC1hdXRob3IiXSwiZW1haWwiOiJnYWJ5Lm1hcnRpbkBleGFtcGxlLmNvbSIsIm5hbWUiOiJHYWJ5IE1hcnRpbiIsInRva2VuX3VzZSI6ImlkIn0.aMM4sTmP7cTzXdIVYBa2Nt3yJoywkSL2WNC3LsDZy6M
                accessToken: eyJraWQiOiJRcDdyMkxtOVdkIiwiYWxnIjoiUlMyNTYifQ.eyJzdWIiOiIzZjhhMmIxYy00ZDVlLTRmNjAtOGE3Yi05YzBkMWUyZjNhNGIiLCJ0b2tlbl91c2UiOiJhY2Nlc3MiLCJzY29wZSI6ImF3cy5jb2duaXRvLnNpZ25pbi51c2VyLmFkbWluIn0.Nt3yJoywkSL2WNC3LsDZy6Mpaji0VGyCUcU2XaA2VZC
                expiresIn: 3600
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidRefreshToken'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '5XX':
          $ref: '#/components/responses/ServerError'

  /auth/new-password:
    post:
      tags: [Authentification]
      operationId: completeNewPassword
      summary: Choisir un mot de passe (première connexion)
      description: >-
        Répond au défi `NEW_PASSWORD_REQUIRED` renvoyé par `POST /auth/login` pour un compte créé par un administrateur : définit le mot de passe définitif et renvoie les jetons. La `session` du défi n'est valable que quelques minutes. La réponse n'est jamais mise en cache.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPasswordRequest'
      responses:
        '200':
          description: Mot de passe défini, utilisateur connecté.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Pragma:
              $ref: '#/components/headers/Pragma'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
        '400':
          description: Données invalides (`VALIDATION_ERROR`, par exemple un mot de passe hors politique), mot de passe refusé par Cognito (`INVALID_PASSWORD`) ou paramètre refusé par Cognito (`INVALID_PARAMETER`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidEmail:
                  $ref: '#/components/examples/InvalidEmail'
                invalidPassword:
                  $ref: '#/components/examples/InvalidPassword'
        '401':
          description: Session expirée ou invalide (`INVALID_CREDENTIALS`) ; recommencer avec `POST /auth/login`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: INVALID_CREDENTIALS
                  message: Invalid credentials or expired session, please log in again
                requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '501':
          $ref: '#/components/responses/UnsupportedChallenge'
        '5XX':
          $ref: '#/components/responses/ServerError'

  /auth/forgot-password:
    post:
      tags: [Authentification]
      operationId: forgotPassword
      summary: Demander la réinitialisation du mot de passe
      description: |-
        Envoie par e-mail un code de réinitialisation du mot de passe (à utiliser avec `POST /auth/reset-password`).

        La réponse est **toujours** `202`, que le compte existe ou non, afin de ne pas permettre l'énumération des comptes. Limite de débit renforcée (2 requêtes/s).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          description: Demande prise en compte.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: If an account exists for this e-mail address, a password reset code has been e-mailed
        '400':
          description: E-mail invalide (`VALIDATION_ERROR`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidEmail:
                  $ref: '#/components/examples/InvalidEmail'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '5XX':
          $ref: '#/components/responses/ServerError'

  /auth/reset-password:
    post:
      tags: [Authentification]
      operationId: resetPassword
      summary: Réinitialiser le mot de passe
      description: Définit un nouveau mot de passe à l'aide du code reçu par e-mail après `POST /auth/forgot-password`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Mot de passe modifié ; l'utilisateur peut se connecter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Password updated, you can now log in with the new password
        '400':
          description: Données invalides (`VALIDATION_ERROR`), code incorrect (`INVALID_CODE`, également renvoyé pour un compte inconnu) ou expiré (`EXPIRED_CODE`), mot de passe refusé par Cognito (`INVALID_PASSWORD`) ou paramètre refusé par Cognito (`INVALID_PARAMETER`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCode:
                  $ref: '#/components/examples/InvalidCode'
                expiredCode:
                  $ref: '#/components/examples/ExpiredCode'
                invalidPassword:
                  $ref: '#/components/examples/InvalidPassword'
        '401':
          $ref: '#/components/responses/AccountOperationRefused'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '5XX':
          $ref: '#/components/responses/ServerError'

  /auth/logout:
    post:
      tags: [Authentification]
      operationId: logout
      summary: Se déconnecter
      description: >-
        Révoque le refresh token ainsi que les access tokens émis à partir de celui-ci. Les ID tokens déjà émis restent acceptés jusqu'à leur expiration (60 minutes au plus, plus 5 minutes au maximum sur les routes protégées du fait du cache de l'authorizer) : supprimez-les côté client.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '204':
          description: Session révoquée.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidRefreshToken'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '5XX':
          $ref: '#/components/responses/ServerError'

  # ---------------------------------------------------------------------------
  # Profils et utilisateurs (UsersFunction)
  # ---------------------------------------------------------------------------
  /me:
    get:
      tags: [Profils]
      operationId: getMyProfile
      summary: Consulter mon profil
      description: Profil de l'utilisateur connecté, avec son rôle et la liste triée de ses permissions effectives (utile pour adapter l'interface), tels que les indique son jeton. Le profil est créé automatiquement lors de la première lecture.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profil de l'utilisateur connecté.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlPrivate'
            Vary:
              $ref: '#/components/headers/Vary'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '5XX':
          $ref: '#/components/responses/ServerError'
    patch:
      tags: [Profils]
      operationId: updateMyProfile
      summary: Modifier mon profil
      description: |-
        Met à jour le profil de l'utilisateur connecté (au moins un champ). `null` efface `bio`, `avatarUrl` ou `website` (une `bio` vide aussi).

        Un changement de `name` est aussi appliqué au compte Cognito : il figure dans les prochains jetons et sur les futurs articles et commentaires ; les articles existants conservent le nom d'auteur d'origine.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
            examples:
              bio:
                summary: Compléter la biographie et le site web
                value:
                  bio: Développeuse cloud, passionnée par le serverless.
                  website: https://gaby.example.com
              clearAvatar:
                summary: Supprimer l'avatar
                value:
                  avatarUrl: null
      responses:
        '200':
          description: Profil mis à jour.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlPrivate'
            Vary:
              $ref: '#/components/headers/Vary'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Changement de `name` alors que le compte Cognito a été supprimé et que le jeton est encore valide (`NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: NOT_FOUND
                  message: User not found
                requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '5XX':
          $ref: '#/components/responses/ServerError'

  /authors/{userId}:
    get:
      tags: [Profils]
      operationId: getAuthor
      summary: Consulter le profil public d'un auteur
      description: Profil public d'un auteur (nom, biographie, avatar, site web), par exemple pour la page « auteur » d'un blog. L'adresse e-mail n'est jamais exposée. Réponse publique cachable 60 secondes.
      security: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Profil public.
          headers:
            Cache-Control:
              description: Réponse publique, toujours cachable.
              schema:
                type: string
                example: 'public, max-age=60, stale-while-revalidate=300'
            Vary:
              $ref: '#/components/headers/Vary'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicAuthor'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '5XX':
          $ref: '#/components/responses/ServerError'

  /users:
    get:
      tags: [Utilisateurs]
      operationId: listUsers
      summary: Lister les utilisateurs
      description: |-
        Liste paginée des comptes du user pool Cognito avec leur rôle (le plus élevé) et leur statut, éventuellement filtrée par rôle.

        Permission `user:manage` (administrateurs), revérifiée à chaque appel dans Amazon Cognito : un administrateur désactivé ou rétrogradé reçoit `403` même avec un jeton encore valide.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit60'
        - name: cursor
          in: query
          required: false
          description: Curseur opaque de pagination, valeur `nextCursor` de la page précédente, obtenue avec le même filtre `role` (sinon `400`).
          schema:
            type: string
            minLength: 1
            maxLength: 4096
        - name: role
          in: query
          required: false
          description: Ne renvoyer que les membres de ce rôle.
          schema:
            $ref: '#/components/schemas/Role'
      responses:
        '200':
          description: Page d'utilisateurs.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlPrivate'
            Vary:
              $ref: '#/components/headers/Vary'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '5XX':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [Utilisateurs]
      operationId: inviteUser
      summary: Créer (inviter) un utilisateur
      description: |-
        Crée un compte avec le rôle choisi, par exemple un éditeur. Cognito envoie à l'utilisateur un e-mail d'invitation contenant un mot de passe temporaire (valable 7 jours) ; à la première connexion, `POST /auth/login` renvoie le défi `NEW_PASSWORD_REQUIRED` (voir `POST /auth/new-password`). L'en-tête `Location` désigne le profil public du compte (`GET /authors/{userId}`).

        - Adresse dont le compte n'a jamais terminé sa première connexion (statut `FORCE_CHANGE_PASSWORD`) : l'invitation est renvoyée, le rôle demandé est appliqué et la réponse est `200` (sans `Location`).
        - Tout autre compte existant pour cette adresse : `409 USER_EXISTS`.

        Permission `user:manage` (administrateurs), revérifiée à chaque appel dans Amazon Cognito : un administrateur désactivé ou rétrogradé reçoit `403` même avec un jeton encore valide.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInviteRequest'
      responses:
        '201':
          description: Compte créé, invitation envoyée.
          headers:
            Location:
              description: Chemin du profil public du compte créé (`GET /authors/{userId}`), relatif à l'hôte de l'API, préfixe de déploiement compris.
              schema:
                type: string
                example: /dev/authors/7c9e6679-7425-40de-944b-e07fc1f90ae7
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
              example:
                id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                email: eddie.durand@example.com
                name: Eddie Durand
                status: FORCE_CHANGE_PASSWORD
                enabled: true
                role: editor
                createdAt: '2026-10-18T11:00:00.000Z'
                updatedAt: '2026-10-18T11:00:00.000Z'
        '200':
          description: Invitation renvoyée à un compte qui n'a pas encore terminé sa première connexion (rôle demandé appliqué, nom inchangé, pas d'en-tête `Location`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
              example:
                id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                email: eddie.durand@example.com
                name: Eddie Durand
                status: FORCE_CHANGE_PASSWORD
                enabled: true
                role: editor
                createdAt: '2026-10-18T11:00:00.000Z'
                updatedAt: '2026-10-18T11:00:00.000Z'
        '400':
          description: Données invalides (`VALIDATION_ERROR`) ou paramètre refusé par Cognito (`INVALID_PARAMETER`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidEmail:
                  $ref: '#/components/examples/InvalidEmail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '409':
          description: Un compte autre qu'une invitation en attente existe déjà pour cette adresse e-mail (`USER_EXISTS`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: USER_EXISTS
                  message: An account already exists for this e-mail address
                requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '5XX':
          $ref: '#/components/responses/ServerError'

  /users/{userId}:
    patch:
      tags: [Utilisateurs]
      operationId: updateUser
      summary: Modifier le rôle ou l'état d'un compte
      description: |-
        Change le rôle d'un utilisateur et/ou active ou désactive son compte (au moins un champ).

        - Un changement de rôle prend effet au prochain renouvellement de jeton de l'utilisateur (ou à sa prochaine connexion).
        - La désactivation révoque aussi ses refresh tokens ; les ID tokens déjà émis restent valables jusqu'à leur expiration (60 minutes au plus, plus 5 minutes au maximum sur les routes protégées du fait du cache de l'authorizer), mais les routes d'administration refusent aussitôt un administrateur désactivé ou rétrogradé.
        - Un administrateur ne peut ni changer son propre rôle ni désactiver son propre compte (`409 SELF_MODIFICATION`).

        Permission `user:manage` (administrateurs), revérifiée à chaque appel dans Amazon Cognito : un administrateur désactivé ou rétrogradé reçoit `403` même avec un jeton encore valide.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
            examples:
              promote:
                summary: Promouvoir en éditeur
                value:
                  role: editor
              disable:
                summary: Désactiver le compte
                value:
                  enabled: false
      responses:
        '200':
          description: Compte mis à jour.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Un administrateur ne peut pas modifier son propre rôle ni se désactiver (`SELF_MODIFICATION`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: SELF_MODIFICATION
                  message: Administrators cannot change their own role or account status
                requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '5XX':
          $ref: '#/components/responses/ServerError'

  # ---------------------------------------------------------------------------
  # Articles (PostsQueryFunction / PostsCommandFunction)
  # ---------------------------------------------------------------------------
  /posts:
    get:
      tags: [Articles]
      operationId: listPosts
      summary: Lister les articles
      description: |-
        Liste paginée d'articles, du plus récent au plus ancien quel que soit le filtre : par date de publication pour `published`, par date de dernière modification pour les autres statuts. Les éléments sont des résumés : le contenu (`content`) n'est jamais inclus dans une liste.

        | Filtres | Accès | Résultat |
        |---|---|---|
        | aucun | public | articles publiés |
        | `tag` | public | articles publiés portant ce tag, filtrables par `author` (projection asynchrone) |
        | `author` | public (`me` : jeton requis) | articles publiés de cet auteur |
        | `status` ≠ `published` | jeton requis | éditeurs et administrateurs : tous les articles de ce statut (filtrables par `author`) ; autres utilisateurs : uniquement leurs propres articles |

        `tag` ne peut pas être combiné avec un statut autre que `published` (`400 VALIDATION_ERROR`). Les listes sont cohérentes à terme ; la liste par tag est une projection mise à jour de façon asynchrone : une modification d'un article (y compris de son `commentCount` ou de sa `version`) y apparaît généralement en moins d'une seconde. La réponse est cachable (`public`) uniquement pour un appel anonyme.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit50'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          required: false
          description: Statut des articles à lister. Un statut autre que `published` exige un jeton.
          schema:
            $ref: '#/components/schemas/PostStatus'
        - name: tag
          in: query
          required: false
          description: Tag recherché (normalisé comme à l'enregistrement, « Serverless AWS » devient `serverless-aws`) ; il doit contenir au moins une lettre ou un chiffre.
          schema:
            type: string
            minLength: 1
            maxLength: 40
          example: serverless
        - name: author
          in: query
          required: false
          description: Identifiant (`sub` Cognito, UUID) d'un auteur, ou `me` pour l'appelant (jeton requis) ; toute autre valeur est refusée (`400`).
          schema:
            type: string
