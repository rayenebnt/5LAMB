  /users:
    get:
      tags: [Utilisateurs]
      operationId: listUsers
      summary: Lister les utilisateurs
      description: Liste paginée des comptes du user pool Cognito avec leur rôle et leur statut, éventuellement filtrée par rôle. Permission `user:manage` (administrateurs).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit60'
        - $ref: '#/components/parameters/Cursor'
