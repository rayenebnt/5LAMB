            X-Amz-Signature: 5d2c3b1a0f9e8d7c6b5a4f3e2d1c0b9a8f7e6d5c4b3a2f1e0d9c8b7a6f5e4d3c
            Content-Type: image/png
          expiresAt: '2026-10-24T16:55:00.000Z'
    MediaList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Media'
        nextCursor:
          type: string
          nullable: true
          description: Curseur de la page suivante (`null` sur la dernière page).
    MediaUploadRequest:
      type: object
      additionalProperties: false
      required: [filename, contentType, size]
      properties:
        filename:
          type: string
          minLength: 1
          maxLength: 200
          description: Nom du fichier d'origine (normalisé par le serveur, l'extension étant déduite du type).
        contentType:
          type: string
          minLength: 1
          maxLength: 100
          description: >-
            Type MIME du fichier, sans tenir compte de la casse ni des paramètres (`Image/PNG; charset=binary` équivaut à `image/png`). Types acceptés : `image/jpeg`, `image/png`, `image/gif`, `image/webp`, `image/avif`, `video/mp4`, `video/webm`, `video/quicktime` ; tout autre type, SVG compris, est refusé (`415`).
          example: image/png
        size:
          type: integer
          minimum: 1
          description: Taille exacte du fichier en octets ; au plus 10 Mio pour une image et 200 Mio pour une vidéo (valeurs par défaut du déploiement), sinon `413`.
