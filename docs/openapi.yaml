    post:
      tags: [Workflow éditorial]
      operationId: publishPost
      summary: Publier un article
      description: |-
        Publie un article `draft`, `in_review` ou `archived` : il devient visible publiquement. `publishedAt` est fixé lors de la première publication (et conservé lors d'une republication) ; la note de relecture (`reviewNote`) est effacée.

        Peu après, de façon asynchrone (généralement en moins d'une seconde) : l'article est indexé (recherche, tags), les abonnés à la newsletter sont notifiés par e-mail (une seule fois par article, et seulement s'il est encore publié à ce moment-là) et un événement `PostPublished` est émis sur Amazon EventBridge.

        Permission `post:publish` (éditeurs et administrateurs).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
