    PostSummary:
      type: object
      description: Représentation d'un article dans les listes (identique à `Post`, sans `content`).
      required: [id, slug, title, excerpt, coverImageUrl, tags, status, allowComments, author, readingTimeMinutes, commentCount, reviewNote, createdAt, updatedAt, submittedAt, publishedAt, version]
      properties:
        id:
