  /me:
    get:
      tags: [Profils]
      operationId: getMyProfile
      summary: Consulter mon profil
      description: Profil de l'utilisateur connecté, avec son rôle et la liste triée de ses permissions effectives (utile pour adapter l'interface). Le profil est créé automatiquement lors de la première lecture.
