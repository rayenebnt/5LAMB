  /posts/{postId}/comments:
    get:
      tags: [Commentaires]
      operationId: listComments
      summary: Lister les commentaires d'un article
      description: |-
        Commentaires d'un article, du plus ancien au plus récent. Par défaut, seuls les commentaires approuvés sont renvoyés, dans leur représentation publique (sans adresse e-mail). L'article doit être visible par l'appelant (publié, ou accessible à son auteur et aux éditeurs), sinon `404`.

        Les modérateurs (permission `comment:moderate` : éditeurs et administrateurs) peuvent demander un autre statut (`pending`, `rejected`, `spam` ou `all`) et reçoivent la représentation de modération (`ModeratorComment`).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostId'
        - $ref: '#/components/parameters/Limit100'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          required: false
          description: Statut des commentaires à lister ; toute autre valeur que `approved` exige la permission `comment:moderate`.
          schema:
            type: string
            enum: [approved, pending, rejected, spam, all]
            default: approved
      responses:
        '200':
          description: Page de commentaires.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentList'
              example:
                items:
                  - id: 0192f4b0-1a2b-7c3d-8e4f-5a6b7c8d9e0f
                    postId: 0192f4a0-5b1c-7d2e-8f3a-4b5c6d7e8f90
                    parentId: null
                    body: Très clair, merci pour le schéma d'architecture !
                    author:
                      id: null
                      name: Lectrice
                    status: approved
                    createdAt: '2026-10-23T10:12:45.000Z'
                  - id: 0192f4b1-2c3d-7e4f-9a5b-6c7d8e9f0a1b
                    postId: 0192f4a0-5b1c-7d2e-8f3a-4b5c6d7e8f90
                    parentId: 0192f4b0-1a2b-7c3d-8e4f-5a6b7c8d9e0f
                    body: Merci ! Le code source complet est dans le dépôt.
                    author:
                      id: 3f8a2b1c-4d5e-4f60-8a7b-9c0d1e2f3a4b
                      name: Gaby Martin
                    status: approved
                    createdAt: '2026-10-23T11:02:10.000Z'
                nextCursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '5XX':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [Commentaires]
      operationId: createComment
      summary: Commenter un article
      description: |-
        Ajoute un commentaire à un article publié dont les commentaires sont ouverts (`allowComments`).

        - **Anonyme** : `authorName` est obligatoire et `authorEmail` facultatif (jamais affiché publiquement). Le commentaire attend une modération (`pending`).
        - **Connecté** (jeton facultatif) : le nom et l'e-mail du compte sont utilisés (`authorName` et `authorEmail` sont ignorés) ; le commentaire d'un utilisateur ayant un rôle est approuvé immédiatement (`approved`).

        `parentId` permet de répondre à un commentaire approuvé du même article. Le champ `website` doit rester vide (champ anti-spam à masquer dans les formulaires). Limite de débit renforcée (5 requêtes/s).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentCreateRequest'
            examples:
              anonymous:
                summary: Commentaire anonyme (modéré)
                value:
                  body: Très clair, merci pour le schéma d'architecture !
                  authorName: Lectrice
                  authorEmail: lectrice@example.com
              reply:
                summary: Réponse d'un utilisateur connecté
                value:
                  body: Merci ! Le code source complet est dans le dépôt.
                  parentId: 0192f4b0-1a2b-7c3d-8e4f-5a6b7c8d9e0f
      responses:
        '201':
          description: Commentaire enregistré (`pending` s'il doit être modéré, `approved` sinon).
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
              examples:
                pending:
                  summary: Commentaire anonyme en attente de modération
                  value:
                    id: 0192f4b0-1a2b-7c3d-8e4f-5a6b7c8d9e0f
                    postId: 0192f4a0-5b1c-7d2e-8f3a-4b5c6d7e8f90
                    parentId: null
                    body: Très clair, merci pour le schéma d'architecture !
                    author:
                      id: null
                      name: Lectrice
                    status: pending
                    createdAt: '2026-10-23T10:12:45.000Z'
                approved:
                  summary: Réponse d'un utilisateur connecté, approuvée d'office
                  value:
                    id: 0192f4b1-2c3d-7e4f-9a5b-6c7d8e9f0a1b
                    postId: 0192f4a0-5b1c-7d2e-8f3a-4b5c6d7e8f90
                    parentId: 0192f4b0-1a2b-7c3d-8e4f-5a6b7c8d9e0f
                    body: Merci ! Le code source complet est dans le dépôt.
                    author:
                      id: 3f8a2b1c-4d5e-4f60-8a7b-9c0d1e2f3a4b
                      name: Gaby Martin
                    status: approved
                    createdAt: '2026-10-23T11:02:10.000Z'
        '400':
          description: Données invalides (`VALIDATION_ERROR`, par exemple `authorName` manquant pour un commentaire anonyme) ou `parentId` qui ne désigne pas un commentaire approuvé de cet article (`INVALID_PARENT`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missingName:
                  summary: Commentaire anonyme sans nom
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: Request validation failed
                      details:
                        - field: authorName
                          message: authorName is required for anonymous comments
                    requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
                invalidParent:
                  summary: Commentaire parent invalide
                  value:
                    error:
                      code: INVALID_PARENT
                      message: parentId must reference an approved comment of the same post
                    requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Les commentaires sont fermés sur cet article (`COMMENTS_DISABLED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: COMMENTS_DISABLED
                  message: Comments are disabled for this post
                requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '5XX':
          $ref: '#/components/responses/ServerError'

