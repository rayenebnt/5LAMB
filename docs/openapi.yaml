            application/json:
              schema:
                $ref: '#/components/schemas/Media'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '5XX':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [Médias]
      operationId: deleteMedia
      summary: Supprimer un média
      description: Supprime le fichier S3 puis le média. Autorisé au propriétaire (permission `media:upload`) ainsi qu'aux éditeurs et administrateurs (`media:delete:any`). Les articles qui utilisent son URL ne sont pas modifiés, et une copie peut rester dans le cache de CloudFront (24 heures au plus par défaut).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MediaId'
      responses:
        '204':
          description: Média supprimé.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '5XX':
          $ref: '#/components/responses/ServerError'

  # ---------------------------------------------------------------------------
  # Recherche (SearchFunction)
  # ---------------------------------------------------------------------------
  /search:
    get:
      tags: [Recherche]
      operationId: searchPosts
      summary: Rechercher des articles
      description: |-
        Recherche plein texte dans les articles publiés (titre, tags, résumé et contenu). La requête est découpée en termes normalisés (minuscules, sans accents, mots vides français et anglais ignorés, 8 termes au plus).

        Les résultats sont classés par nombre de termes trouvés, puis par score de pertinence (terme du titre +10, d'un tag +6, du résumé +3, du contenu +1 par occurrence jusqu'à +5), puis par date de publication. Une requête sans terme significatif renvoie une liste vide.

        L'index est mis à jour de façon asynchrone, généralement moins d'une seconde après une publication ou une modification. Réponse publique cachable 60 secondes.
      security: []
      parameters:
        - name: q
          in: query
          required: true
          description: Texte recherché.
          schema:
            type: string
            minLength: 1
            maxLength: 200
          example: lambda dynamodb
        - $ref: '#/components/parameters/Limit50'
      responses:
        '200':
          description: Résultats de recherche (les `limit` meilleurs).
          headers:
            Cache-Control:
              description: Réponse publique cachable 60 secondes, puis encore servie au plus 300 secondes pendant sa revalidation.
              schema:
                type: string
                example: 'public, max-age=60, stale-while-revalidate=300'
            Vary:
              $ref: '#/components/headers/Vary'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResults'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '5XX':
          $ref: '#/components/responses/ServerError'

  /tags:
    get:
      tags: [Recherche]
      operationId: listTags
      summary: Lister les tags
      description: Tags des articles publiés avec leur nombre d'articles, du plus utilisé au moins utilisé puis par ordre alphabétique (nuage de tags). Mis à jour de façon asynchrone ; réponse publique cachable 5 minutes. Cette route n'accepte aucun paramètre de requête.
      security: []
      responses:
        '200':
          description: Tags utilisés par au moins un article publié.
          headers:
            Cache-Control:
              description: Réponse publique cachable 5 minutes, puis encore servie au plus 25 minutes pendant sa revalidation.
              schema:
                type: string
                example: 'public, max-age=300, stale-while-revalidate=1500'
            Vary:
              $ref: '#/components/headers/Vary'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagList'
        '400':
          description: Paramètre de requête présent, alors que cette route n'en accepte aucun (`VALIDATION_ERROR`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Request validation failed
                  details:
                    - field: (root)
                      message: 'Unknown field(s): limit'
                requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '5XX':
          $ref: '#/components/responses/ServerError'

  # ---------------------------------------------------------------------------
  # Newsletter (SubscriptionsFunction)
  # ---------------------------------------------------------------------------
  /subscriptions:
    post:
      tags: [Newsletter]
      operationId: subscribe
      summary: S'abonner à la newsletter
      description: |-
        Abonne une adresse e-mail aux annonces des nouveaux articles (Amazon SNS). SNS envoie un e-mail de confirmation (double opt-in) : l'abonnement n'est actif qu'après un clic sur le lien qu'il contient. Chaque annonce comporte un lien de désabonnement.

        Avec `tags`, seuls les articles portant au moins l'un de ces tags sont annoncés (politique de filtrage SNS) ; sans `tags`, tous les articles le sont.

        Une adresse déjà abonnée, avec les mêmes tags ou d'autres, reçoit la même réponse `202`, afin de ne pas révéler qui est abonné ; elle conserve ses préférences d'origine (se désabonner pour les changer). Limite de débit renforcée (2 requêtes/s).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionRequest'
            examples:
              all:
                summary: Tous les nouveaux articles
                value:
                  email: lectrice@example.com
              filtered:
                summary: Uniquement certains tags
                value:
                  email: lectrice@example.com
                  tags: [Serverless, DynamoDB]
      responses:
        '202':
          description: Demande enregistrée, confirmation à effectuer depuis l'e-mail reçu (même réponse pour une adresse déjà abonnée).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionPending'
        '400':
          description: Données invalides (`VALIDATION_ERROR`) ou demande refusée par Amazon SNS (`INVALID_PARAMETER`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidEmail:
                  $ref: '#/components/examples/InvalidEmail'
                rejectedBySns:
                  summary: Demande refusée par Amazon SNS
                  value:
                    error:
                      code: INVALID_PARAMETER
                      message: Invalid subscription request
                    requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
        '409':
          description: Le quota d'abonnements filtrés par tags (politiques de filtrage Amazon SNS) est atteint ; abonnez-vous sans `tags` (`TAG_SUBSCRIPTIONS_FULL`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: TAG_SUBSCRIPTIONS_FULL
                  message: Tag-filtered subscriptions are full, please subscribe without tags
                requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/NewsletterUnavailable'
        '5XX':
          $ref: '#/components/responses/ServerError'
    get:
      tags: [Newsletter]
      operationId: listSubscriptions
      summary: Lister les abonnés à la newsletter
      description: Liste paginée des abonnements e-mail et de leur état de confirmation. Permission `subscription:read` (administrateurs).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page d'abonnements.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlPrivate'
            Vary:
              $ref: '#/components/headers/Vary'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/NewsletterUnavailable'
        '5XX':
          $ref: '#/components/responses/ServerError'

  # ---------------------------------------------------------------------------
  # Système (DocsFunction)
  # ---------------------------------------------------------------------------
  /docs:
    get:
      tags: [Système]
      operationId: getSwaggerUi
      summary: Documentation interactive (Swagger UI)
      description: Page HTML de documentation interactive générée à partir de ce document OpenAPI (Swagger UI). Cliquez sur **Authorize** et collez un ID token pour essayer les routes protégées.
      security: []
      responses:
        '200':
          description: Page HTML Swagger UI.
          headers:
            Cache-Control:
              description: Page cachable 1 heure.
              schema:
                type: string
                example: 'public, max-age=3600'
            Content-Security-Policy:
              description: Politique de sécurité du contenu (scripts limités au CDN de Swagger UI et au script d'initialisation de la page).
              schema:
                type: string
          content:
            text/html:
              schema:
                type: string
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '5XX':
          $ref: '#/components/responses/ServerError'

  /openapi.json:
    get:
      tags: [Système]
      operationId: getOpenApiDocument
      summary: Document OpenAPI (JSON)
      description: Ce document OpenAPI 3.0.3 au format JSON, par exemple pour générer un client. `servers` y est remplacé par l'URL (domaine et stage) par laquelle l'API a été appelée.
      security: []
      responses:
        '200':
          description: Document OpenAPI.
          headers:
            Cache-Control:
              description: Document cachable 5 minutes.
              schema:
                type: string
                example: 'public, max-age=300'
          content:
            application/json:
              schema:
                type: object
                description: Document OpenAPI 3.0.3.
                required: [openapi, info, paths]
                properties:
                  openapi:
                    type: string
                    example: '3.0.3'
                  info:
                    type: object
                  servers:
                    type: array
                    items:
                      type: object
                  paths:
                    type: object
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '5XX':
          $ref: '#/components/responses/ServerError'

  /health:
    get:
      tags: [Système]
      operationId: getHealth
      summary: État de santé du service
      description: Vérification de disponibilité, sans appel aux autres services AWS (supervision, tests de fumée). Renvoie la version et le stage déployés.
      security: []
      responses:
        '200':
          description: Service disponible.
          headers:
            Cache-Control:
              description: Jamais mis en cache.
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '5XX':
          $ref: '#/components/responses/ServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |-
        Jeton d'identité **Amazon Cognito** (Cognito ID token, JWT signé RS256), champ `idToken` des réponses de `POST /auth/login`, `POST /auth/refresh` et `POST /auth/new-password`, envoyé dans l'en-tête `Authorization: Bearer <idToken>`.

        L'access token est refusé : seul l'ID token porte les claims `email`, `name` et `cognito:groups` (rôles) utilisés par l'API. Validité : 60 minutes ; sur les routes protégées, la vérification est mise en cache 300 secondes par jeton, qui reste donc accepté jusqu'à 5 minutes après son expiration.

  parameters:
    PostIdOrSlug:
      name: postId
      in: path
      required: true
      description: Identifiant (UUID) **ou slug** de l'article.
      schema:
        type: string
        minLength: 1
        maxLength: 80
      examples:
        id:
          summary: Identifiant
          value: 0192f4a0-5b1c-7d2e-8f3a-4b5c6d7e8f90
        slug:
          summary: Slug
          value: architecture-serverless-avec-aws-lambda
    PostId:
      name: postId
      in: path
      required: true
      description: Identifiant (UUID) de l'article ; une autre valeur, slug compris, est refusée (`400 VALIDATION_ERROR`).
      schema:
        type: string
        format: uuid
      example: 0192f4a0-5b1c-7d2e-8f3a-4b5c6d7e8f90
    CommentId:
      name: commentId
      in: path
      required: true
      description: Identifiant (UUID) du commentaire ; mal formé → `400 VALIDATION_ERROR`.
      schema:
        type: string
        format: uuid
      example: 0192f4b0-1a2b-7c3d-8e4f-5a6b7c8d9e0f
    MediaId:
      name: mediaId
      in: path
      required: true
      description: Identifiant (UUID) du média ; mal formé → `400 VALIDATION_ERROR`.
      schema:
        type: string
        format: uuid
      example: 0192f4c2-3d4e-7f5a-8b6c-7d8e9f0a1b2c
    UserId:
      name: userId
      in: path
      required: true
      description: Identifiant de l'utilisateur (`sub` Cognito, UUID) ; mal formé → `400 VALIDATION_ERROR`.
      schema:
        type: string
        format: uuid
      example: 3f8a2b1c-4d5e-4f60-8a7b-9c0d1e2f3a4b
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: |-
        Version attendue de l'article : valeur de l'en-tête `ETag` reçue lors de la dernière lecture (`"v3"`). Si l'article a été modifié entre-temps, la requête est refusée avec `412 PRECONDITION_FAILED`.
        Formats acceptés : `"v3"`, `W/"v3"`, `v3` ou `3` ; `*` ou en-tête absent : pas de contrôle. Valeur mal formée → `400 BAD_REQUEST`.
      schema:
        type: string
      example: '"v3"'
    Cursor:
      name: cursor
      in: query
      required: false
      description: Curseur opaque de pagination, valeur `nextCursor` de la page précédente.
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    Limit50:
      name: limit
      in: query
      required: false
      description: Nombre maximal d'éléments renvoyés (1 à 50).
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 10
    Limit60:
      name: limit
      in: query
      required: false
      description: Nombre maximal d'éléments renvoyés (1 à 60).
      schema:
        type: integer
        minimum: 1
        maximum: 60
        default: 20
    Limit100:
      name: limit
      in: query
      required: false
      description: Nombre maximal d'éléments renvoyés (1 à 100).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  headers:
    ETag:
      description: Version courante de l'article (`"v<version>"`), à renvoyer dans l'en-tête `If-Match` d'une modification.
      schema:
        type: string
        example: '"v4"'
    Location:
      description: >-
        Chemin de la ressource créée, relatif à l'hôte de l'API et préfixe de déploiement compris : stage sur l'URL `execute-api` (`/dev/posts/…`), chemin de base sur un domaine personnalisé. Il se résout donc directement contre l'URL de la requête.
      schema:
        type: string
        example: /dev/posts/0192f6e1-8a2b-7c3d-9e4f-5a6b7c8d9e0f
    CacheControl:
      description: |-
        `public, max-age=60, stale-while-revalidate=300` pour un appel anonyme sur un contenu public ; `private, no-store` dès qu'un jeton est fourni ou que le contenu n'est pas public.
      schema:
        type: string
        example: 'public, max-age=60, stale-while-revalidate=300'
    CacheControlPrivate:
      description: Toujours `private, no-store` (réponse propre à l'appelant, à ne pas mettre en cache).
      schema:
        type: string
        example: 'private, no-store'
    CacheControlNoStore:
      description: Toujours `no-store` (réponse contenant des jetons ou une session, à ne jamais mettre en cache).
      schema:
        type: string
        example: no-store
    Pragma:
      description: Toujours `no-cache` (pour les caches HTTP/1.0, comme le recommande la RFC 6749).
      schema:
        type: string
        example: no-cache
    Vary:
      description: '`Authorization` : un cache doit distinguer les requêtes selon leur jeton, afin de ne pas servir une réponse anonyme à un appelant authentifié.'
      schema:
        type: string
        example: Authorization
    RetryAfter:
      description: Délai conseillé, en secondes, avant de réessayer (réponses `503`).
      schema:
        type: integer
        example: 1
    WwwAuthenticate:
      description: Schéma d'authentification attendu (`Bearer`), présent lorsque le refus provient de l'authorizer d'API Gateway.
      schema:
        type: string
        example: Bearer

  examples:
    InvalidEmail:
      summary: Adresse e-mail invalide (VALIDATION_ERROR)
      value:
        error:
          code: VALIDATION_ERROR
          message: Request validation failed
          details:
            - field: email
              message: Invalid e-mail address
        requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
    InvalidPassword:
      summary: Mot de passe refusé par Cognito (INVALID_PASSWORD)
      value:
        error:
          code: INVALID_PASSWORD
          message: The password does not satisfy the password policy
        requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
    InvalidCode:
      summary: Code incorrect ou compte inconnu (INVALID_CODE)
      value:
        error:
          code: INVALID_CODE
          message: Invalid verification code
        requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
    ExpiredCode:
      summary: Code expiré (EXPIRED_CODE)
      value:
        error:
          code: EXPIRED_CODE
          message: The verification code has expired, please request a new one
        requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e

  responses:
    BadRequest:
      description: Requête invalide. `VALIDATION_ERROR` (avec `details`) pour un corps, un paramètre de requête ou un identifiant du chemin non conformes, champ ou paramètre inconnu compris ; `BAD_REQUEST` pour un JSON mal formé, un curseur de pagination ou un en-tête `If-Match` invalide.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            validation:
              summary: Champ invalide ou inconnu (VALIDATION_ERROR)
              value:
                error:
                  code: VALIDATION_ERROR
                  message: Request validation failed
                  details:
                    - field: title
                      message: Title is required
                    - field: (root)
                      message: 'Unknown field(s): status'
                requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
            invalidPathId:
              summary: Identifiant mal formé dans le chemin (VALIDATION_ERROR)
              value:
                error:
                  code: VALIDATION_ERROR
                  message: Request validation failed
                  details:
                    - field: postId
                      message: Must be a valid identifier (UUID)
                requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
            unknownQueryParameter:
              summary: Paramètre de requête inconnu (VALIDATION_ERROR)
              value:
                error:
                  code: VALIDATION_ERROR
                  message: Request validation failed
                  details:
                    - field: (root)
                      message: 'Unknown field(s): _'
                requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
            malformedJson:
              summary: JSON mal formé (BAD_REQUEST)
              value:
                error:
                  code: BAD_REQUEST
                  message: Request body must be valid JSON
                requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
            invalidCursor:
              summary: Curseur de pagination invalide (BAD_REQUEST)
              value:
                error:
                  code: BAD_REQUEST
                  message: Invalid pagination cursor
                requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
    Unauthorized:
      description: Jeton absent, mal formé, invalide ou expiré (`UNAUTHORIZED`). Obtenez un ID token avec `POST /auth/login` ou `POST /auth/refresh`. Sur les routes protégées, le refus vient de l'authorizer d'API Gateway (en-tête `WWW-Authenticate`) ; sur les routes à jeton facultatif, de la fonction elle-même.
      headers:
        WWW-Authenticate:
          $ref: '#/components/headers/WwwAuthenticate'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: UNAUTHORIZED
              message: Missing, invalid or expired token
            requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
    InvalidRefreshToken:
      description: Refresh token invalide, expiré ou révoqué (`INVALID_TOKEN`) ; l'utilisateur doit se reconnecter.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: INVALID_TOKEN
              message: Invalid, expired or revoked token
            requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
    Forbidden:
      description: L'appelant est authentifié mais n'a pas la permission nécessaire (`FORBIDDEN`) — rôle insuffisant, ressource d'un autre utilisateur, ou statut qui ne permet plus l'action à son rôle.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: FORBIDDEN
              message: You do not have permission to perform this action
            requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
    NotFound:
      description: Ressource inexistante, ou non visible par l'appelant (`NOT_FOUND`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: NOT_FOUND
              message: Resource not found
            requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
    WorkflowConflict:
      description: Transition impossible depuis le statut actuel de l'article (`INVALID_STATE_TRANSITION`), ou modification concurrente (`CONFLICT`) persistante sans `If-Match` ou en cours au même moment.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidTransition:
              summary: Transition interdite
              value:
                error:
                  code: INVALID_STATE_TRANSITION
                  message: Cannot publish a post whose status is 'published'
                requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
            concurrentUpdate:
              summary: Écritures simultanées
              value:
                error:
                  code: CONFLICT
                  message: The post was modified by another request, please retry
                requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
    UserExists:
      description: Un compte existe déjà pour cette adresse e-mail (`USER_EXISTS`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: USER_EXISTS
              message: An account already exists for this e-mail address
            requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
    AdminForbidden:
      description: >-
        Permission `user:manage` manquante, ou appelant qui n'est plus un administrateur actif dans Amazon Cognito (compte désactivé, supprimé ou rétrogradé), même si son jeton est encore valide (`FORBIDDEN`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missingPermission:
              summary: Rôle sans la permission user:manage
              value:
                error:
                  code: FORBIDDEN
                  message: You do not have permission to perform this action
                requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
            revoked:
              summary: Administrateur désactivé ou rétrogradé depuis l'émission du jeton
              value:
                error:
                  code: FORBIDDEN
                  message: Your administrator rights have been revoked
                requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
    AccountOperationRefused:
      description: Opération refusée par Amazon Cognito pour ce compte, par exemple un compte désactivé (`INVALID_CREDENTIALS`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: INVALID_CREDENTIALS
              message: This operation is not allowed for this account
            requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
    CommentConflict:
      description: Écritures simultanées (`CONFLICT`) ; le commentaire a été modifié par une autre requête, ou l'article reçoit trop d'écritures concurrentes. Relisez puis réessayez.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            commentChanged:
              summary: Commentaire modifié par une autre requête
              value:
                error:
                  code: CONFLICT
                  message: The comment was changed by a concurrent request, please retry
                requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
            busyPost:
              summary: Trop d'écritures concurrentes sur l'article
              value:
                error:
                  code: CONFLICT
                  message: Too many concurrent updates of this post, please retry
                requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
    ServiceUnavailable:
      description: Écriture limitée par Amazon DynamoDB (`SERVICE_UNAVAILABLE`) ; réessayez après le délai indiqué par `Retry-After`.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: SERVICE_UNAVAILABLE
              message: The service is busy, please retry shortly
            requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
    NewsletterUnavailable:
      description: Amazon SNS momentanément saturé, ou quota d'abonnements atteint (`SERVICE_UNAVAILABLE`) ; réessayez après le délai indiqué par `Retry-After`.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: SERVICE_UNAVAILABLE
              message: The newsletter service is busy, please retry later
            requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
    UnsupportedChallenge:
      description: Cognito exige un défi d'authentification que l'API ne sait pas traiter, par exemple une authentification multifacteur (MFA, non activée sur le user pool déployé) (`UNSUPPORTED_CHALLENGE`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: UNSUPPORTED_CHALLENGE
              message: The authentication challenge SOFTWARE_TOKEN_MFA is not supported by this API
            requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
    PreconditionFailed:
      description: >-
        L'article a été modifié depuis sa lecture : la version indiquée par `If-Match` n'est plus la version courante (`PRECONDITION_FAILED`). Relisez l'article puis réessayez.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: PRECONDITION_FAILED
              message: The resource was modified by another request (version mismatch)
            requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
    PayloadTooLarge:
      description: Corps de requête supérieur à 1 Mio (`PAYLOAD_TOO_LARGE`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: PAYLOAD_TOO_LARGE
              message: Request body must not exceed 1048576 bytes
            requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
    UnsupportedMediaType:
      description: >-
        Le corps de la requête doit être envoyé en JSON (`Content-Type: application/json`) (`UNSUPPORTED_MEDIA_TYPE`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: UNSUPPORTED_MEDIA_TYPE
              message: Content-Type must be application/json
            requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
    TooManyRequests:
      description: Limite de débit d'API Gateway dépassée, ou trop de tentatives auprès d'Amazon Cognito (`TOO_MANY_REQUESTS`). Réessayez plus tard, avec un délai croissant.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: TOO_MANY_REQUESTS
              message: Rate limit exceeded, retry later
            requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
    ServerError:
      description: |-
        Erreur côté serveur : `500 INTERNAL_ERROR` (erreur inattendue, sans détail interne : communiquez le `requestId`), `503 SERVICE_UNAVAILABLE` (service AWS momentanément saturé, ou clés publiques de Cognito inaccessibles pour vérifier un jeton facultatif : réessayer après `Retry-After` secondes), `500 AUTHORIZER_FAILURE` (authorizer indisponible sur une route protégée), `502`/`504` (échec ou dépassement de délai de la fonction, renvoyés par API Gateway).
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            internal:
              summary: Erreur inattendue (500)
              value:
                error:
                  code: INTERNAL_ERROR
                  message: An unexpected error occurred
                requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
            unavailable:
              summary: Service momentanément saturé (503)
              value:
                error:
                  code: SERVICE_UNAVAILABLE
                  message: The service is busy, please retry shortly
                requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e

  schemas:
    # ------------------------------------------------------------------ Errors
    Error:
      type: object
      description: Enveloppe commune à toutes les erreurs (fonctions Lambda et réponses d'API Gateway).
      required: [error, requestId]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Code d'erreur stable, exploitable par programme (voir le tableau des codes en introduction).
              example: NOT_FOUND
            message:
              type: string
              description: Message lisible (en anglais), destiné aux développeurs ; ne pas l'analyser.
              example: Resource not found
            details:
              type: array
              description: Liste des problèmes détectés (erreurs de validation `VALIDATION_ERROR`).
              items:
                $ref: '#/components/schemas/ErrorDetail'
        requestId:
          type: string
          description: Identifiant de la requête, à communiquer pour retrouver la requête dans les journaux.
          example: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
    ErrorDetail:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: Chemin du champ ou du paramètre en erreur (`tags.2` pour un élément de tableau, `(root)` pour l'objet entier, par exemple un champ ou un paramètre de requête inconnu).
          example: title
        message:
          type: string
          example: Title is required
    Message:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: Message d'information (en anglais).
          example: Check your inbox to continue.

    # ------------------------------------------------------- Shared / users
    Email:
      type: string
      format: email
      maxLength: 254
      description: Adresse e-mail (espaces supprimés, normalisée en minuscules).
      example: gaby.martin@example.com
    Password:
      type: string
      format: password
      minLength: 8
      maxLength: 256
      pattern: '^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])'
      description: Mot de passe d'au moins 8 caractères contenant une minuscule, une majuscule et un chiffre (politique du user pool Cognito).
      example: Blogify2026!
    Role:
      type: string
      enum: [admin, editor, guest-author]
      description: Rôle (groupe Cognito) d'un utilisateur.
      example: editor
    Permission:
      type: string
      enum:
        - 'post:create'
        - 'post:read:any'
        - 'post:update:own'
        - 'post:update:any'
        - 'post:delete:own'
        - 'post:delete:any'
        - 'post:submit'
        - 'post:publish'
        - 'comment:moderate'
        - 'media:upload'
        - 'media:read:any'
        - 'media:delete:any'
        - 'user:manage'
        - 'subscription:read'
      description: Permission accordée par un rôle (matrice RBAC).
      example: 'post:create'
    UserRef:
      type: object
      description: Référence vers un utilisateur (auteur d'un article, propriétaire d'un média).
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
          description: Identifiant de l'utilisateur (`sub` Cognito).
          example: 3f8a2b1c-4d5e-4f60-8a7b-9c0d1e2f3a4b
        name:
          type: string
          description: Nom affiché au moment de la création de la ressource ; `Anonymous` si le compte n'avait pas de nom (jamais dérivé de l'adresse e-mail).
          example: Gaby Martin
    UserProfile:
      type: object
      description: Profil complet de l'utilisateur connecté.
      required: [id, email, name, role, roles, permissions, bio, avatarUrl, website, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          description: Identifiant de l'utilisateur (`sub` Cognito).
        email:
          type: string
          format: email
          nullable: true
          description: Adresse e-mail du compte (issue du jeton), `null` si elle est inconnue.
        name:
          type: string
          description: Nom affiché (celui du profil, sinon celui du compte ; `Anonymous` à défaut, jamais dérivé de l'adresse e-mail).
        role:
          type: string
          enum: [admin, editor, guest-author, null]
          nullable: true
          description: Rôle principal (le plus élevé), `null` pour un compte sans groupe.
        roles:
          type: array
          description: Tous les rôles du compte, du plus au moins privilégié.
          items:
            $ref: '#/components/schemas/Role'
        permissions:
          type: array
          description: Permissions effectives, triées par ordre alphabétique.
          items:
            $ref: '#/components/schemas/Permission'
        bio:
          type: string
          maxLength: 1000
          nullable: true
        avatarUrl:
          type: string
          format: uri
          nullable: true
        website:
          type: string
          format: uri
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      example:
        id: 3f8a2b1c-4d5e-4f60-8a7b-9c0d1e2f3a4b
        email: gaby.martin@example.com
        name: Gaby Martin
        role: guest-author
        roles: [guest-author]
        permissions: ['media:upload', 'post:create', 'post:delete:own', 'post:submit', 'post:update:own']
        bio: Développeuse cloud, passionnée par le serverless.
        avatarUrl: https://d1a2b3c4d5e6f7.cloudfront.net/media/0192f4c3-4e5f-7a6b-8c7d-8e9f0a1b2c3d/avatar.webp
        website: https://gaby.example.com
        createdAt: '2026-10-19T18:22:10.000Z'
        updatedAt: '2026-10-21T07:45:00.000Z'
    ProfileUpdateRequest:
      type: object
      description: Champs du profil à modifier (au moins un).
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: Nouveau nom affiché.
        bio:
          type: string
          maxLength: 1000
          nullable: true
          description: Biographie (`null` pour l'effacer).
        avatarUrl:
          type: string
          format: uri
          maxLength: 2048
          nullable: true
          description: URL http(s) de l'avatar, par exemple l'`url` d'un média (`null` pour l'effacer).
        website:
          type: string
          format: uri
          maxLength: 2048
          nullable: true
          description: URL http(s) du site personnel (`null` pour l'effacer).
    PublicAuthor:
      type: object
      description: Profil public d'un auteur.
      required: [id, name, bio, avatarUrl, website]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Nom affiché (`Anonymous` si le compte n'a pas de nom).
        bio:
          type: string
          nullable: true
        avatarUrl:
          type: string
          format: uri
          nullable: true
        website:
          type: string
          format: uri
          nullable: true
      example:
        id: 3f8a2b1c-4d5e-4f60-8a7b-9c0d1e2f3a4b
        name: Gaby Martin
        bio: Développeuse cloud, passionnée par le serverless.
        avatarUrl: https://d1a2b3c4d5e6f7.cloudfront.net/media/0192f4c3-4e5f-7a6b-8c7d-8e9f0a1b2c3d/avatar.webp
        website: https://gaby.example.com
    CognitoUserStatus:
      type: string
      enum: [UNCONFIRMED, CONFIRMED, ARCHIVED, COMPROMISED, UNKNOWN, RESET_REQUIRED, FORCE_CHANGE_PASSWORD, EXTERNAL_PROVIDER, null]
      nullable: true
      description: Statut du compte dans Amazon Cognito (`FORCE_CHANGE_PASSWORD` tant qu'un utilisateur invité n'a pas choisi son mot de passe), `null` si Cognito ne le fournit pas.
      example: CONFIRMED
    AdminUser:
      type: object
      description: Compte utilisateur vu par un administrateur. Les attributs absents du compte Cognito (par exemple le nom d'un compte créé dans la console sans attribut `name`) valent `null`.
      required: [id, email, name, status, enabled, role, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          description: Identifiant de l'utilisateur (`sub` Cognito).
        email:
          type: string
          format: email
          nullable: true
        name:
          type: string
          nullable: true
          description: Attribut `name` du compte Cognito, `null` s'il est absent.
        status:
          $ref: '#/components/schemas/CognitoUserStatus'
        enabled:
          type: boolean
          description: '`false` si le compte est désactivé (connexion impossible).'
        role:
          type: string
          enum: [admin, editor, guest-author, null]
          nullable: true
          description: Rôle principal (le plus élevé), `null` pour un compte sans groupe.
        createdAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
      example:
        id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        email: eddie.durand@example.com
        name: Eddie Durand
        status: CONFIRMED
        enabled: true
        role: editor
        createdAt: '2026-10-18T11:00:00.000Z'
        updatedAt: '2026-10-18T11:05:00.000Z'
    AdminUserList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
        nextCursor:
          type: string
          nullable: true
          description: Curseur de la page suivante (`null` sur la dernière page).
    UserInviteRequest:
      type: object
      additionalProperties: false
      required: [email, name, role]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: Nom affiché.
        role:
          $ref: '#/components/schemas/Role'
      example:
        email: eddie.durand@example.com
        name: Eddie Durand
        role: editor
    UserUpdateRequest:
      type: object
      description: Modifications à appliquer (au moins un champ).
      additionalProperties: false
      minProperties: 1
      properties:
        role:
          $ref: '#/components/schemas/Role'
        enabled:
          type: boolean
          description: '`false` désactive le compte (et révoque ses sessions), `true` le réactive.'

    # ---------------------------------------------------------- Auth facade
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, name]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          $ref: '#/components/schemas/Password'
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: Nom affiché (signature des articles et commentaires).
      example:
        email: gaby.martin@example.com
        password: Blogify2026!
        name: Gaby Martin
    RegisterResponse:
      type: object
      required: [userId, email, name, role, confirmed, nextStep]
      properties:
        userId:
          type: string
          format: uuid
          description: Identifiant du compte (`sub` Cognito).
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [guest-author]
          description: Rôle attribué aux comptes créés par inscription.
        confirmed:
          type: boolean
          description: '`true` si le compte est déjà confirmé (mode démonstration).'
        nextStep:
          type: string
          enum: [LOGIN, CONFIRM_SIGN_UP]
          description: Étape suivante, `LOGIN` (`POST /auth/login`) ou `CONFIRM_SIGN_UP` (`POST /auth/confirm` avec le code reçu par e-mail).
    ConfirmRequest:
      type: object
      additionalProperties: false
      required: [email, code]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        code:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^\S+$'
          description: Code de vérification reçu par e-mail, sans espace.
          example: '123456'
      example:
        email: gaby.martin@example.com
        code: '123456'
    ConfirmResponse:
      type: object
      required: [confirmed]
      properties:
        confirmed:
          type: boolean
          enum: [true]
      example:
        confirmed: true
    EmailRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          $ref: '#/components/schemas/Email'
      example:
        email: gaby.martin@example.com
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 256
          description: Mot de passe (ou mot de passe temporaire reçu par e-mail). La politique de mot de passe n'est pas vérifiée ici ; un mot de passe incorrect donne `401`.
      example:
        email: gaby.martin@example.com
        password: Blogify2026!
    Tokens:
      type: object
      description: Jetons Amazon Cognito.
      required: [tokenType, idToken, accessToken, expiresIn]
      properties:
        tokenType:
          type: string
          enum: [Bearer]
        idToken:
          type: string
          description: '**Jeton à envoyer dans `Authorization: Bearer <idToken>`** (JWT, 60 minutes).'
        accessToken:
          type: string
          description: Access token Cognito (non accepté par cette API).
        refreshToken:
          type: string
          description: Jeton de renouvellement (30 jours), à conserver de façon sûre ; absent de la réponse de `POST /auth/refresh` lorsque Cognito n'en émet pas de nouveau.
        expiresIn:
          type: integer
          description: Durée de validité de l'ID token et de l'access token, en secondes.
          example: 3600
      example:
        tokenType: Bearer
        idToken: eyJraWQiOiJCazN4OFFtMlp0IiwiYWxnIjoiUlMyNTYifQ.eyJzdWIiOiIzZjhhMmIxYy00ZDVlLTRmNjAtOGE3Yi05YzBkMWUyZjNhNGIiLCJjb2duaXRvOmdyb3VwcyI6WyJndWVzdC1hdXRob3IiXSwiZW1haWwiOiJnYWJ5Lm1hcnRpbkBleGFtcGxlLmNvbSIsIm5hbWUiOiJHYWJ5IE1hcnRpbiIsInRva2VuX3VzZSI6ImlkIn0.aMM4sTmP7cTzXdIVYBa2Nt3yJoywkSL2WNC3LsDZy6M
        accessToken: eyJraWQiOiJRcDdyMkxtOVdkIiwiYWxnIjoiUlMyNTYifQ.eyJzdWIiOiIzZjhhMmIxYy00ZDVlLTRmNjAtOGE3Yi05YzBkMWUyZjNhNGIiLCJ0b2tlbl91c2UiOiJhY2Nlc3MiLCJzY29wZSI6ImF3cy5jb2duaXRvLnNpZ25pbi51c2VyLmFkbWluIn0.Nt3yJoywkSL2WNC3LsDZy6Mpaji0VGyCUcU2XaA2VZC
        refreshToken: eyJjdHkiOiJKV1QiLCJlbmMiOiJBMjU2R0NNIiwiYWxnIjoiUlNBLU9BRVAifQ.ZXhhbXBsZS1rZXk.ZXhhbXBsZS1pdg.ZXhhbXBsZS1jaXBoZXJ0ZXh0.ZXhhbXBsZS10YWc
        expiresIn: 3600
    NewPasswordChallenge:
      type: object
      description: Défi renvoyé à la première connexion d'un compte créé par un administrateur.
      required: [challenge, session]
      properties:
        challenge:
          type: string
          enum: [NEW_PASSWORD_REQUIRED]
        session:
          type: string
          description: Session du défi, à renvoyer à `POST /auth/new-password` (valable quelques minutes).
    RefreshTokenRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 1
          maxLength: 8192
          pattern: '^[A-Za-z0-9_.-]+$'
          description: Refresh token reçu à la connexion (chaîne opaque de lettres, chiffres, `_`, `.` et `-`).
      example:
        refreshToken: eyJjdHkiOiJKV1QiLCJlbmMiOiJBMjU2R0NNIiwiYWxnIjoiUlNBLU9BRVAifQ.ZXhhbXBsZS1rZXk.ZXhhbXBsZS1pdg.ZXhhbXBsZS1jaXBoZXJ0ZXh0.ZXhhbXBsZS10YWc
    NewPasswordRequest:
      type: object
      additionalProperties: false
      required: [email, newPassword, session]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        newPassword:
          $ref: '#/components/schemas/Password'
        session:
          type: string
          minLength: 1
          maxLength: 2048
          description: Valeur `session` du défi `NEW_PASSWORD_REQUIRED`.
      example:
        email: eddie.durand@example.com
        newPassword: Redaction2026!
        session: AYABeEXAMPLEsessionTokenReturnedByCognito
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [email, code, newPassword]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        code:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^\S+$'
          description: Code reçu par e-mail, sans espace.
          example: '654321'
        newPassword:
          $ref: '#/components/schemas/Password'
      example:
        email: gaby.martin@example.com
        code: '654321'
        newPassword: Nouveau2026!

    # ------------------------------------------------------------------- Posts
    PostStatus:
      type: string
      enum: [draft, in_review, published, archived]
      default: published
      description: Statut éditorial, `draft` (brouillon), `in_review` (soumis à relecture), `published` (visible publiquement) ou `archived` (retiré du site, republiable).
      example: published
    PostSummary:
      type: object
      description: Représentation d'un article dans les listes (identique à `Post`, sans `content`).
      required: [id, slug, title, excerpt, coverImageUrl, tags, status, allowComments, author, readingTimeMinutes, commentCount, reviewNote, createdAt, updatedAt, submittedAt, publishedAt, version]
      properties:
        id:
          type: string
          format: uuid
          description: Identifiant de l'article (UUID v7).
        slug:
          type: string
          maxLength: 80
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          description: Identifiant lisible et unique (jamais de la forme d'un UUID), utilisable à la place de l'identifiant dans `GET /posts/{postId}`.
        title:
          type: string
          maxLength: 200
        excerpt:
          type: string
          maxLength: 500
          description: Résumé fourni par l'auteur, ou généré à partir du contenu (200 caractères au plus).
        coverImageUrl:
          type: string
          format: uri
          nullable: true
          description: URL de l'image de couverture.
        tags:
          type: array
          maxItems: 10
          description: Tags normalisés (minuscules, sans accents, mots séparés par des tirets).
          items:
            type: string
        status:
          $ref: '#/components/schemas/PostStatus'
        allowComments:
          type: boolean
          description: '`false` si les commentaires sont fermés.'
        author:
          $ref: '#/components/schemas/UserRef'
        readingTimeMinutes:
          type: integer
          minimum: 1
          description: Temps de lecture estimé (200 mots par minute).
        commentCount:
          type: integer
          minimum: 0
          description: Nombre de commentaires approuvés (dans la liste par tag, copie mise à jour de façon asynchrone, généralement en moins d'une seconde).
        reviewNote:
          type: string
          nullable: true
          description: Motif du dernier rejet en relecture (effacé à la publication).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        submittedAt:
          type: string
          format: date-time
          nullable: true
          description: Date de la dernière soumission à relecture.
        publishedAt:
          type: string
          format: date-time
          nullable: true
          description: Date de première publication (conservée lors d'une republication).
        version:
          type: integer
          minimum: 1
          description: Version de l'article, incrémentée à chaque modification (reprise dans l'`ETag`).
      example:
        id: 0192f4a0-5b1c-7d2e-8f3a-4b5c6d7e8f90
        slug: architecture-serverless-avec-aws-lambda
        title: Architecture serverless avec AWS Lambda
        excerpt: Concevoir une API REST scalable et économique avec API Gateway, Lambda et DynamoDB.
        coverImageUrl: https://d1a2b3c4d5e6f7.cloudfront.net/media/0192f4c2-3d4e-7f5a-8b6c-7d8e9f0a1b2c/schema-architecture.png
        tags: [aws, serverless, dynamodb]
        status: published
        allowComments: true
        author:
          id: 3f8a2b1c-4d5e-4f60-8a7b-9c0d1e2f3a4b
          name: Gaby Martin
        readingTimeMinutes: 4
        commentCount: 2
        reviewNote: null
        createdAt: '2026-10-20T08:30:00.000Z'
        updatedAt: '2026-10-22T14:05:12.000Z'
        submittedAt: '2026-10-21T09:15:00.000Z'
        publishedAt: '2026-10-22T14:05:12.000Z'
        version: 4
    Post:
      description: Article complet (réponses portant sur un seul article), avec son contenu Markdown.
      allOf:
        - $ref: '#/components/schemas/PostSummary'
        - type: object
          required: [content]
          properties:
            content:
              type: string
              maxLength: 100000
              description: Contenu au format Markdown.
      example:
        id: 0192f4a0-5b1c-7d2e-8f3a-4b5c6d7e8f90
        slug: architecture-serverless-avec-aws-lambda
        title: Architecture serverless avec AWS Lambda
        excerpt: Concevoir une API REST scalable et économique avec API Gateway, Lambda et DynamoDB.
        content: "# Introduction\n\nUne API **serverless** repose sur trois services : API Gateway, Lambda et DynamoDB."
        coverImageUrl: https://d1a2b3c4d5e6f7.cloudfront.net/media/0192f4c2-3d4e-7f5a-8b6c-7d8e9f0a1b2c/schema-architecture.png
        tags: [aws, serverless, dynamodb]
        status: published
        allowComments: true
        author:
          id: 3f8a2b1c-4d5e-4f60-8a7b-9c0d1e2f3a4b
          name: Gaby Martin
        readingTimeMinutes: 4
        commentCount: 2
        reviewNote: null
        createdAt: '2026-10-20T08:30:00.000Z'
        updatedAt: '2026-10-22T14:05:12.000Z'
        submittedAt: '2026-10-21T09:15:00.000Z'
        publishedAt: '2026-10-22T14:05:12.000Z'
        version: 4
    PostList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PostSummary'
        nextCursor:
          type: string
          nullable: true
          description: Curseur de la page suivante (`null` sur la dernière page).
    PostCreateRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Titre (espaces de début et de fin supprimés).
        content:
          type: string
          maxLength: 100000
          default: ''
          description: Contenu au format Markdown.
        excerpt:
          type: string
          maxLength: 500
          nullable: true
          description: Résumé personnalisé ; absent, vide ou `null`, il est généré à partir du contenu.
        tags:
          type: array
          maxItems: 10
          description: Tags, normalisés (« Serverless AWS » devient `serverless-aws`) et dédoublonnés ; un tag vide une fois normalisé (« !!! ») est refusé.
          items:
            type: string
            minLength: 1
            maxLength: 40
        slug:
          type: string
          maxLength: 80
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          description: Slug personnalisé (minuscules, chiffres et tirets), qui ne doit pas avoir la forme d'un UUID (réservée aux identifiants) ; par défaut, dérivé du titre.
        coverImageUrl:
          type: string
          format: uri
          maxLength: 2048
          nullable: true
          description: URL http(s) de l'image de couverture, par exemple l'`url` d'un média `ready`.
        allowComments:
          type: boolean
          default: true
          description: Ouvre ou ferme les commentaires.
    PostUpdateRequest:
      type: object
      description: Champs à modifier (au moins un). Le statut se modifie par les routes du workflow éditorial.
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        content:
          type: string
          maxLength: 100000
          description: Contenu Markdown (le résumé automatique et le temps de lecture sont recalculés).
        excerpt:
          type: string
          maxLength: 500
          nullable: true
          description: Résumé personnalisé ; `null` ou vide rétablit le résumé automatique.
        tags:
          type: array
          maxItems: 10
          description: Nouvelle liste complète des tags (remplace l'ancienne).
          items:
            type: string
            minLength: 1
            maxLength: 40
        slug:
          type: string
          maxLength: 80
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          description: Nouveau slug (l'ancien est libéré), qui ne doit pas avoir la forme d'un UUID.
        coverImageUrl:
          type: string
          format: uri
          maxLength: 2048
          nullable: true
          description: URL http(s) de l'image de couverture (`null` pour la supprimer).
        allowComments:
          type: boolean
    PostRejectRequest:
      type: object
      description: Corps facultatif du rejet.
      additionalProperties: false
      properties:
        note:
          type: string
          maxLength: 1000
          nullable: true
          description: Motif du rejet, communiqué à l'auteur dans `reviewNote` (`null` ou vide = sans motif).
    EmptyRequest:
      type: object
      description: Corps facultatif, vide ou objet JSON vide (`{}`) ; tout champ est refusé.
      additionalProperties: false
      maxProperties: 0
      example: {}

    # ---------------------------------------------------------------- Comments
    CommentStatus:
      type: string
      enum: [pending, approved, rejected, spam]
      description: Statut de modération ; seuls les commentaires `approved` sont publics.
      example: approved
    CommentAuthor:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
          nullable: true
          description: Identifiant de l'auteur connecté, `null` pour un commentaire anonyme.
        name:
          type: string
          description: Nom affiché, `authorName` d'un anonyme ou nom du compte connecté (`Anonymous` si le compte n'a pas de nom).
    Comment:
      type: object
      description: Représentation publique d'un commentaire (l'adresse e-mail de l'auteur n'est jamais exposée).
      required: [id, postId, parentId, body, author, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: Identifiant du commentaire (UUID v7, ordre chronologique).
        postId:
          type: string
          format: uuid
        parentId:
          type: string
          format: uuid
          nullable: true
          description: Commentaire auquel celui-ci répond, `null` pour un commentaire de premier niveau.
        body:
          type: string
          minLength: 1
          maxLength: 2000
          description: Texte du commentaire (texte brut, à échapper à l'affichage).
        author:
          $ref: '#/components/schemas/CommentAuthor'
        status:
          $ref: '#/components/schemas/CommentStatus'
        createdAt:
          type: string
          format: date-time
      example:
        id: 0192f4b0-1a2b-7c3d-8e4f-5a6b7c8d9e0f
        postId: 0192f4a0-5b1c-7d2e-8f3a-4b5c6d7e8f90
        parentId: null
        body: Très clair, merci pour le schéma d'architecture !
        author:
          id: null
          name: Lectrice
        status: approved
        createdAt: '2026-10-23T10:12:45.000Z'
    ModeratorComment:
      description: Représentation de modération d'un commentaire, représentation publique complétée des informations de modération.
      allOf:
        - $ref: '#/components/schemas/Comment'
        - type: object
          required: [authorEmail, postTitle, moderatedBy, moderatedAt, updatedAt]
          properties:
            authorEmail:
              type: string
              format: email
              nullable: true
              description: E-mail de l'auteur (fourni par un anonyme ou issu du compte), `null` si inconnu.
            postTitle:
              type: string
              nullable: true
              description: Titre de l'article au moment du commentaire, `null` s'il est inconnu.
            moderatedBy:
              type: string
              format: uuid
              nullable: true
              description: Identifiant du dernier modérateur.
            moderatedAt:
              type: string
              format: date-time
              nullable: true
              description: Date de la dernière modération.
            updatedAt:
              type: string
              format: date-time
      example:
        id: 0192f4b0-1a2b-7c3d-8e4f-5a6b7c8d9e0f
        postId: 0192f4a0-5b1c-7d2e-8f3a-4b5c6d7e8f90
        parentId: null
        body: Très clair, merci pour le schéma d'architecture !
        author:
          id: null
          name: Lectrice
        status: pending
        createdAt: '2026-10-23T10:12:45.000Z'
        authorEmail: lectrice@example.com
        postTitle: Architecture serverless avec AWS Lambda
        moderatedBy: null
        moderatedAt: null
        updatedAt: '2026-10-23T10:12:45.000Z'
    CommentList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          description: Commentaires du plus ancien au plus récent ; les modérateurs reçoivent la représentation `ModeratorComment`.
          items:
            anyOf:
              - $ref: '#/components/schemas/Comment'
              - $ref: '#/components/schemas/ModeratorComment'
        nextCursor:
          type: string
          nullable: true
          description: Curseur de la page suivante (`null` sur la dernière page).
    ModeratorCommentList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ModeratorComment'
        nextCursor:
          type: string
          nullable: true
          description: Curseur de la page suivante (`null` sur la dernière page).
    CommentCreateRequest:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 2000
          description: Texte du commentaire (espaces de début et de fin supprimés).
        authorName:
          type: string
          minLength: 1
          maxLength: 80
          description: Nom affiché, **obligatoire pour un commentaire anonyme** (ignoré avec un jeton).
        authorEmail:
          type: string
          format: email
          maxLength: 254
          description: E-mail facultatif d'un auteur anonyme, visible des seuls modérateurs (ignoré avec un jeton) ; une chaîne vide équivaut à son absence.
        parentId:
          type: string
          format: uuid
          nullable: true
          description: Commentaire **approuvé** du même article auquel on répond ; `null` ou vide pour un commentaire de premier niveau.
        website:
          type: string
          nullable: true
          description: Champ anti-spam qui doit rester vide ou `null` (à masquer dans les formulaires) ; rempli, le commentaire est classé comme spam.
    CommentModerationRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [approved, rejected, spam]
          description: Nouveau statut du commentaire.

    # ------------------------------------------------------------------- Media
    MediaContentType:
      type: string
      enum: [image/jpeg, image/png, image/gif, image/webp, image/avif, video/mp4, video/webm, video/quicktime]
      description: Type MIME du fichier, sous sa forme canonique (minuscules, sans paramètre).
      example: image/png
    MediaKind:
      type: string
      enum: [image, video]
      description: Catégorie du média, déduite de son type MIME.
    MediaStatus:
      type: string
      enum: [pending, ready, rejected]
      description: '`pending` (en attente du fichier ou de sa validation), `ready` (validé, URL disponible), `rejected` (refusé par la validation, fichier supprimé).'
    Media:
      type: object
      description: Média de la médiathèque.
      required: [id, filename, contentType, kind, size, status, altText, url, owner, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        filename:
          type: string
          description: Nom de fichier normalisé (minuscules, sans accents ni espaces), avec l'extension correspondant au type.
          example: schema-architecture.png
        contentType:
          $ref: '#/components/schemas/MediaContentType'
        kind:
          $ref: '#/components/schemas/MediaKind'
        size:
          type: integer
          minimum: 1
          description: Taille en octets (déclarée, puis réelle une fois le fichier validé).
        status:
          $ref: '#/components/schemas/MediaStatus'
        altText:
          type: string
          maxLength: 300
          nullable: true
          description: Texte alternatif (accessibilité).
        url:
          type: string
          format: uri
          nullable: true
          description: URL de téléchargement, `null` tant que le média n'est pas `ready` ; URL CloudFront permanente (CloudFront ne diffuse que les fichiers validés), ou URL S3 présignée temporaire sans CDN.
        urlExpiresAt:
          type: string
          format: date-time
          nullable: true
          description: Expiration de `url`, présent uniquement pour une URL S3 présignée.
        owner:
          $ref: '#/components/schemas/UserRef'
        rejectionReason:
          type: string
          nullable: true
          description: Motif du refus, présent uniquement pour un média `rejected`.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      example:
        id: 0192f4c2-3d4e-7f5a-8b6c-7d8e9f0a1b2c
        filename: schema-architecture.png
        contentType: image/png
        kind: image
        size: 48213
        status: ready
        altText: Schéma de l'architecture serverless
        url: https://d1a2b3c4d5e6f7.cloudfront.net/media/0192f4c2-3d4e-7f5a-8b6c-7d8e9f0a1b2c/schema-architecture.png
        owner:
          id: 3f8a2b1c-4d5e-4f60-8a7b-9c0d1e2f3a4b
          name: Gaby Martin
        createdAt: '2026-10-24T16:40:00.000Z'
        updatedAt: '2026-10-24T16:40:03.000Z'
    PresignedPost:
      type: object
      description: Autorisation de téléversement direct vers Amazon S3 (formulaire POST présigné).
      required: [method, url, fields, expiresAt]
      properties:
        method:
          type: string
          enum: [POST]
          description: Méthode HTTP à utiliser.
        url:
          type: string
          format: uri
          description: URL du bucket S3 à laquelle envoyer le formulaire `multipart/form-data`.
        fields:
          type: object
          description: Champs à recopier tels quels dans le formulaire, avant le champ `file` (clé de l'objet, politique signée, signature, `Content-Type`…).
          additionalProperties:
            type: string
        expiresAt:
          type: string
          format: date-time
          description: Expiration de l'autorisation (15 minutes par défaut).
    MediaUpload:
      description: Média créé (`pending`) et autorisation de téléversement.
