# OpenAPI description of the Blogify REST API.
# Source of truth for the API contract: scripts/build.mjs converts it to dist/docs/openapi.json,
# served by GET /openapi.json and rendered by Swagger UI on GET /docs.
# tests/unit/template.test.mjs and tests/unit/docs-openapi.test.mjs check that it documents exactly
# the routes of template.yaml, that every $ref resolves and that every example matches its schema.
openapi: '3.0.3'
info:
  title: Blogify API
  version: '1.0.0'
  license:
    name: MIT
  description: |-
    **Blogify** est une plateforme de blogging *headless* 100 % serverless : cette API REST (Amazon API Gateway + AWS Lambda) gère les articles et leur workflow éditorial, les commentaires, la médiathèque, la recherche plein texte, la newsletter et les comptes utilisateurs. Les données sont stockées dans Amazon DynamoDB, les fichiers dans Amazon S3 (diffusés par Amazon CloudFront) et les identités dans Amazon Cognito.

    ## Authentification

    1. Créez un compte avec `POST /auth/register` (rôle `guest-author`), puis connectez-vous avec `POST /auth/login`.
    2. Envoyez le **jeton d'identité Cognito** (`idToken`, et non l'`accessToken`) dans l'en-tête `Authorization: Bearer <idToken>`. Il est valable 60 minutes : renouvelez-le avec `POST /auth/refresh` (refresh token valable 30 jours) et révoquez la session avec `POST /auth/logout`.
    3. Les routes protégées (cadenas) sont contrôlées par un authorizer Lambda qui vérifie la signature, l'expiration, l'émetteur, l'audience et `token_use = id` du jeton : jeton absent, invalide ou expiré → `401 UNAUTHORIZED`.
    4. Certaines routes publiques acceptent un jeton **facultatif** qui personnalise la réponse (brouillons visibles par leur auteur, commentaires d'un membre approuvés d'office…) ; un jeton fourni mais invalide y est refusé (`401 UNAUTHORIZED`).

    Sur cette page, cliquez sur **Authorize** et collez l'`idToken` (sans le préfixe `Bearer`).

    ## Rôles et permissions

    Les rôles sont des groupes Amazon Cognito, transmis dans le claim `cognito:groups` de l'ID token :

    | Rôle | Peut… |
    |---|---|
    | `admin` | tout faire, y compris gérer les comptes et les rôles (`/users`) et consulter les abonnés à la newsletter |
    | `editor` | lire, modifier, publier, rejeter, archiver et supprimer **tous** les articles ; modérer les commentaires ; gérer toute la médiathèque |
    | `guest-author` | créer ses propres articles, les modifier ou les supprimer tant qu'ils sont en brouillon ou en relecture, les soumettre à relecture ; téléverser des médias |

    Les nouveaux inscrits sont `guest-author`. Un compte sans groupe est authentifié mais n'a aucun droit d'écriture. Un changement de rôle prend effet au prochain renouvellement du jeton. Permission manquante → `403 FORBIDDEN` ; une ressource que l'appelant n'a pas le droit de voir (brouillon d'un autre auteur, média en attente…) est signalée comme inexistante (`404 NOT_FOUND`) afin de ne pas révéler son existence.

    ## Pagination

    Les listes renvoient `{ "items": [...], "nextCursor": "..." }`. Pour obtenir la page suivante, renvoyez la valeur de `nextCursor` dans le paramètre `cursor` (avec les mêmes filtres) ; `nextCursor` vaut `null` sur la dernière page. Le curseur est **opaque** : ne le construisez pas et ne le modifiez pas (curseur invalide → `400 BAD_REQUEST`). La taille des pages se règle avec `limit` ; une page peut contenir moins de `limit` éléments sans être la dernière : seul `nextCursor` indique la fin de la liste.

    ## Format des erreurs

    Toutes les erreurs, qu'elles proviennent des fonctions Lambda ou d'API Gateway, ont la même forme :

    ```json
    {
      "error": {
        "code": "VALIDATION_ERROR",
        "message": "Request validation failed",
        "details": [{ "field": "title", "message": "Too small: expected string to have >=1 characters" }]
      },
      "requestId": "c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e"
    }
    ```

    `code` est stable et destiné aux programmes, `message` (en anglais) aux développeurs ; `details` n'est présent que pour les erreurs de validation ; `requestId` identifie la requête dans les journaux. Les corps JSON sont validés strictement : un champ inconnu est refusé (`400 VALIDATION_ERROR`). Les erreurs inattendues ne révèlent jamais de détail interne.

    | HTTP | Codes |
    |---|---|
    | 400 | `VALIDATION_ERROR`, `BAD_REQUEST`, `INVALID_PARENT`, `INVALID_PASSWORD`, `INVALID_PARAMETER`, `INVALID_CODE`, `EXPIRED_CODE` |
    | 401 | `UNAUTHORIZED`, `INVALID_CREDENTIALS`, `INVALID_TOKEN` |
    | 403 | `FORBIDDEN`, `COMMENTS_DISABLED`, `USER_NOT_CONFIRMED`, `PASSWORD_RESET_REQUIRED` |
    | 404 | `NOT_FOUND`, `ROUTE_NOT_FOUND` |
    | 409 | `CONFLICT`, `SLUG_TAKEN`, `INVALID_STATE_TRANSITION`, `USER_EXISTS`, `SELF_MODIFICATION`, `ALREADY_SUBSCRIBED` |
    | 412 | `PRECONDITION_FAILED` |
    | 413 | `PAYLOAD_TOO_LARGE` |
    | 415 | `UNSUPPORTED_MEDIA_TYPE` |
    | 429 | `TOO_MANY_REQUESTS` |
    | 5xx | `INTERNAL_ERROR`, `SERVICE_UNAVAILABLE` (avec l'en-tête `Retry-After`) |

    ## Concurrence optimiste (ETag / If-Match)

    Chaque article porte un numéro de `version`, incrémenté à chaque modification et renvoyé dans l'en-tête `ETag` (`"v3"`). Renvoyez cette valeur dans l'en-tête `If-Match` de `PATCH /posts/{postId}`, `DELETE /posts/{postId}` et des transitions du workflow : si l'article a été modifié entre-temps, la requête est refusée (`412 PRECONDITION_FAILED`) au lieu d'écraser le travail d'un autre utilisateur ; relisez l'article puis réessayez. Sans `If-Match`, une écriture concurrente est retentée automatiquement une fois, puis signalée par `409 CONFLICT`.

    ## Téléversement des médias (presigned POST)

    Les fichiers ne transitent pas par l'API : ils sont envoyés directement à Amazon S3.

    1. `POST /media` avec `filename`, `contentType` et `size` (en octets) : le média est créé au statut `pending` et la réponse contient une autorisation de téléversement `upload` (URL et champs signés, valable 15 minutes).
    2. Envoyez une requête `POST` `multipart/form-data` vers `upload.url` contenant tous les champs de `upload.fields`, puis le fichier dans un dernier champ `file`. S3 répond `204 No Content`. Le fichier doit avoir le `Content-Type` déclaré et ne pas dépasser la taille déclarée (`size`).
    3. Le fichier est vérifié de façon asynchrone (type, taille et signature binaire réels) : le média passe à `ready` (son `url` devient disponible) ou à `rejected` (`rejectionReason`, fichier supprimé). Interrogez `GET /media/{mediaId}` pour suivre son statut.

    Formats acceptés : JPEG, PNG, GIF, WebP et AVIF (10 Mio maximum par défaut), MP4, WebM et QuickTime (200 Mio maximum par défaut). Le SVG est refusé (risque de XSS). Un média jamais téléversé est purgé automatiquement après 24 heures.

    ## Cohérence à terme

    Certaines vues sont des projections mises à jour **de façon asynchrone** (DynamoDB Streams), généralement quelques secondes après la publication, la modification ou la suppression d'un article : la recherche (`GET /search`), les tags (`GET /tags`), la liste par tag (`GET /posts?tag=…`), la suppression des commentaires d'un article supprimé, ainsi que l'envoi de la newsletter (Amazon SNS) et de l'événement `PostPublished` (Amazon EventBridge). Les autres lectures reflètent immédiatement les écritures.

    ## Limites de débit et cache

    API Gateway limite le débit à 100 requêtes/s (rafales de 200), avec des limites plus strictes sur les routes exposées aux abus (`POST /auth/register`, `POST /auth/login`, `POST /auth/forgot-password`, `POST /posts/{postId}/comments`, `POST /subscriptions`) : au-delà → `429 TOO_MANY_REQUESTS`. Les lectures publiques anonymes sont cachables (`Cache-Control: public, max-age=…`) ; les réponses personnalisées sont marquées `private, no-store`.

    ## Conventions

    JSON en UTF-8 (`Content-Type: application/json` obligatoire pour les corps de requête, 1 Mio maximum), champs en camelCase, dates ISO 8601 en UTC, identifiants UUID (v7, triables chronologiquement, pour les articles, commentaires et médias ; `sub` Cognito pour les utilisateurs). Création → `201 Created` avec l'en-tête `Location` ; suppression → `204 No Content`. CORS : en-têtes `Content-Type`, `Authorization` et `If-Match` autorisés ; `ETag` et `Location` exposés.

servers:
  - url: 'https://{apiId}.execute-api.{region}.amazonaws.com/{stage}'
    description: 'API Gateway (dans GET /openapi.json, remplacé par l''URL réellement appelée)'
    variables:
      apiId:
        default: abcdef1234
        description: Identifiant de l'API REST (voir la sortie ApiUrl de la pile CloudFormation)
      region:
        default: eu-west-3
        description: Région AWS du déploiement
      stage:
        default: dev
        description: Stage API Gateway (paramètre Stage du template SAM)
  - url: 'http://127.0.0.1:3000'
    description: Exécution locale (sam local start-api)

# Secure by default, like the API Gateway DefaultAuthorizer; every operation also states its own security.
security:
  - bearerAuth: []

tags:
  - name: Authentification
    description: Inscription, connexion, jetons et mots de passe (façade sur Amazon Cognito). Routes publiques.
  - name: Profils
    description: Profil de l'utilisateur connecté et profils publics des auteurs.
  - name: Utilisateurs
    description: Administration des comptes et des rôles (administrateurs).
  - name: Articles
    description: Lecture publique des articles (API de diffusion) et rédaction.
  - name: Workflow éditorial
    description: |-
      Transitions de statut d'un article. Chaque transition n'est possible que depuis certains statuts (sinon `409 INVALID_STATE_TRANSITION`) :

      | Action | Depuis | Vers | Qui |
      |---|---|---|---|
      | `submit` | `draft` | `in_review` | l'auteur, ou un éditeur / administrateur |
      | `publish` | `draft`, `in_review`, `archived` | `published` | éditeur / administrateur |
      | `unpublish` | `published` | `draft` | éditeur / administrateur |
      | `reject` | `in_review` | `draft` | éditeur / administrateur |
      | `archive` | `draft`, `in_review`, `published` | `archived` | éditeur / administrateur |

      Toutes les transitions acceptent l'en-tête `If-Match` et renvoient l'article complet avec son nouvel `ETag`.
  - name: Commentaires
    description: Commentaires des lecteurs (anonymes ou connectés) et modération.
  - name: Médias
    description: Médiathèque (images et vidéos) avec téléversement direct vers Amazon S3 et validation asynchrone.
  - name: Recherche
    description: Recherche plein texte et tags des articles publiés (index mis à jour de façon asynchrone).
  - name: Newsletter
    description: Abonnement par e-mail aux nouveaux articles (Amazon SNS, double opt-in).
  - name: Système
    description: Documentation interactive, document OpenAPI et supervision.

paths:
  # ---------------------------------------------------------------------------
  # Authentification (AuthFunction) - public routes
  # ---------------------------------------------------------------------------
  /auth/register:
    post:
      tags: [Authentification]
      operationId: register
      summary: Créer un compte (auteur invité)
      description: |-
        Crée un compte Amazon Cognito avec le rôle `guest-author` (auteur invité) ainsi que son profil public.

        - En mode démonstration (paramètre de déploiement `AutoConfirmUsers=true`), le compte est confirmé immédiatement : `confirmed: true`, `nextStep: LOGIN`.
        - Sinon, Cognito envoie un code de vérification par e-mail : `confirmed: false`, `nextStep: CONFIRM_SIGN_UP` (voir `POST /auth/confirm`).

        Limite de débit renforcée (5 requêtes/s).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Compte créé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
              examples:
                autoConfirmed:
                  summary: Compte confirmé automatiquement (mode démonstration)
                  value:
                    userId: 3f8a2b1c-4d5e-4f60-8a7b-9c0d1e2f3a4b
                    email: gaby.martin@example.com
                    name: Gaby Martin
                    role: guest-author
                    confirmed: true
                    nextStep: LOGIN
                confirmationRequired:
                  summary: Confirmation par e-mail requise
                  value:
                    userId: 3f8a2b1c-4d5e-4f60-8a7b-9c0d1e2f3a4b
                    email: gaby.martin@example.com
                    name: Gaby Martin
                    role: guest-author
                    confirmed: false
                    nextStep: CONFIRM_SIGN_UP
        '400':
          description: Données invalides (`VALIDATION_ERROR`), mot de passe refusé par la politique Cognito (`INVALID_PASSWORD`) ou paramètre refusé par Cognito (`INVALID_PARAMETER`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidEmail:
                  $ref: '#/components/examples/InvalidEmail'
                invalidPassword:
                  $ref: '#/components/examples/InvalidPassword'
        '409':
          $ref: '#/components/responses/UserExists'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '5XX':
          $ref: '#/components/responses/ServerError'

  /auth/confirm:
    post:
      tags: [Authentification]
      operationId: confirmRegistration
      summary: Confirmer l'inscription
      description: Confirme un compte avec le code reçu par e-mail après l'inscription (inutile lorsque les comptes sont confirmés automatiquement).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmRequest'
      responses:
        '200':
          description: Compte confirmé ; l'utilisateur peut se connecter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmResponse'
        '400':
          description: Données invalides (`VALIDATION_ERROR`), code incorrect (`INVALID_CODE`) ou expiré (`EXPIRED_CODE`, demander un nouveau code avec `POST /auth/resend-code`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCode:
                  $ref: '#/components/examples/InvalidCode'
                expiredCode:
                  $ref: '#/components/examples/ExpiredCode'
        '401':
          description: Confirmation refusée par Cognito, par exemple pour un compte déjà confirmé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: INVALID_CREDENTIALS
                  message: 'User cannot be confirmed. Current status is CONFIRMED'
                requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '5XX':
          $ref: '#/components/responses/ServerError'

  /auth/resend-code:
    post:
      tags: [Authentification]
      operationId: resendConfirmationCode
      summary: Renvoyer le code de confirmation
      description: Renvoie par e-mail le code de confirmation d'inscription.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          description: Code renvoyé (si le compte existe et n'est pas encore confirmé).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: A new confirmation code has been sent by e-mail.
        '400':
          description: E-mail invalide (`VALIDATION_ERROR`) ou compte déjà confirmé (`INVALID_PARAMETER`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidEmail:
                  $ref: '#/components/examples/InvalidEmail'
                alreadyConfirmed:
                  summary: Compte déjà confirmé
                  value:
                    error:
                      code: INVALID_PARAMETER
                      message: User is already confirmed.
                    requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '5XX':
          $ref: '#/components/responses/ServerError'

  /auth/login:
    post:
      tags: [Authentification]
      operationId: login
      summary: Se connecter
      description: |-
        Authentifie l'utilisateur (flux Cognito `USER_PASSWORD_AUTH`) et renvoie ses jetons. Utilisez **`idToken`** dans l'en-tête `Authorization: Bearer <idToken>` des routes protégées.

        À la première connexion d'un compte créé par un administrateur (mot de passe temporaire reçu par e-mail), la réponse est le défi `NEW_PASSWORD_REQUIRED` accompagné d'une `session` : terminez la connexion avec `POST /auth/new-password`.

        Limite de débit renforcée (10 requêtes/s).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Connexion réussie (jetons) ou nouveau mot de passe exigé (défi).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Tokens'
                  - $ref: '#/components/schemas/NewPasswordChallenge'
              examples:
                tokens:
                  summary: Connexion réussie
                  value:
                    tokenType: Bearer
                    idToken: eyJraWQiOiJCazN4OFFtMlp0IiwiYWxnIjoiUlMyNTYifQ.eyJzdWIiOiIzZjhhMmIxYy00ZDVlLTRmNjAtOGE3Yi05YzBkMWUyZjNhNGIiLCJjb2duaXRvOmdyb3VwcyI6WyJndWVzdC1hdXRob3IiXSwiZW1haWwiOiJnYWJ5Lm1hcnRpbkBleGFtcGxlLmNvbSIsIm5hbWUiOiJHYWJ5IE1hcnRpbiIsInRva2VuX3VzZSI6ImlkIn0.aMM4sTmP7cTzXdIVYBa2Nt3yJoywkSL2WNC3LsDZy6M
                    accessToken: eyJraWQiOiJRcDdyMkxtOVdkIiwiYWxnIjoiUlMyNTYifQ.eyJzdWIiOiIzZjhhMmIxYy00ZDVlLTRmNjAtOGE3Yi05YzBkMWUyZjNhNGIiLCJ0b2tlbl91c2UiOiJhY2Nlc3MiLCJzY29wZSI6ImF3cy5jb2duaXRvLnNpZ25pbi51c2VyLmFkbWluIn0.Nt3yJoywkSL2WNC3LsDZy6Mpaji0VGyCUcU2XaA2VZC
                    refreshToken: eyJjdHkiOiJKV1QiLCJlbmMiOiJBMjU2R0NNIiwiYWxnIjoiUlNBLU9BRVAifQ.ZXhhbXBsZS1rZXk.ZXhhbXBsZS1pdg.ZXhhbXBsZS1jaXBoZXJ0ZXh0.ZXhhbXBsZS10YWc
                    expiresIn: 3600
                newPasswordRequired:
                  summary: Première connexion avec un mot de passe temporaire
                  value:
                    challenge: NEW_PASSWORD_REQUIRED
                    session: AYABeEXAMPLEsessionTokenReturnedByCognito
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: E-mail ou mot de passe incorrect, ou compte désactivé (`INVALID_CREDENTIALS`). Le message ne permet pas de savoir si le compte existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: INVALID_CREDENTIALS
                  message: Incorrect e-mail or password
                requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
        '403':
          description: Compte non confirmé (`USER_NOT_CONFIRMED`, voir `POST /auth/confirm`) ou réinitialisation du mot de passe exigée (`PASSWORD_RESET_REQUIRED`, voir `POST /auth/forgot-password`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notConfirmed:
                  summary: Compte non confirmé
                  value:
                    error:
                      code: USER_NOT_CONFIRMED
                      message: User is not confirmed
                    requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
                passwordResetRequired:
                  summary: Réinitialisation du mot de passe exigée
                  value:
                    error:
                      code: PASSWORD_RESET_REQUIRED
                      message: Password reset required for the user
                    requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '5XX':
          $ref: '#/components/responses/ServerError'

  /auth/refresh:
    post:
      tags: [Authentification]
      operationId: refreshTokens
      summary: Renouveler les jetons
      description: Obtient un nouvel ID token et un nouvel access token à partir du refresh token (valable 30 jours). Le refresh token n'est renvoyé que si Cognito en émet un nouveau ; sinon, conservez celui reçu à la connexion.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Nouveaux jetons.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
              example:
                tokenType: Bearer
                idToken: eyJraWQiOiJCazN4OFFtMlp0IiwiYWxnIjoiUlMyNTYifQ.eyJzdWIiOiIzZjhhMmIxYy00ZDVlLTRmNjAtOGE3Yi05YzBkMWUyZjNhNGIiLCJjb2duaXRvOmdyb3VwcyI6WyJndWVzdC1hdXRob3IiXSwiZW1haWwiOiJnYWJ5Lm1hcnRpbkBleGFtcGxlLmNvbSIsIm5hbWUiOiJHYWJ5IE1hcnRpbiIsInRva2VuX3VzZSI6ImlkIn0.aMM4sTmP7cTzXdIVYBa2Nt3yJoywkSL2WNC3LsDZy6M
                accessToken: eyJraWQiOiJRcDdyMkxtOVdkIiwiYWxnIjoiUlMyNTYifQ.eyJzdWIiOiIzZjhhMmIxYy00ZDVlLTRmNjAtOGE3Yi05YzBkMWUyZjNhNGIiLCJ0b2tlbl91c2UiOiJhY2Nlc3MiLCJzY29wZSI6ImF3cy5jb2duaXRvLnNpZ25pbi51c2VyLmFkbWluIn0.Nt3yJoywkSL2WNC3LsDZy6Mpaji0VGyCUcU2XaA2VZC
                expiresIn: 3600
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidRefreshToken'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '5XX':
          $ref: '#/components/responses/ServerError'

  /auth/new-password:
    post:
      tags: [Authentification]
      operationId: completeNewPassword
      summary: Choisir un mot de passe (première connexion)
      description: >-
        Répond au défi `NEW_PASSWORD_REQUIRED` renvoyé par `POST /auth/login` pour un compte créé par un administrateur : définit le mot de passe définitif et renvoie les jetons. La `session` du défi n'est valable que quelques minutes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPasswordRequest'
      responses:
        '200':
          description: Mot de passe défini, utilisateur connecté.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
        '400':
          description: Données invalides (`VALIDATION_ERROR`), mot de passe refusé par la politique Cognito (`INVALID_PASSWORD`) ou paramètre refusé par Cognito (`INVALID_PARAMETER`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidEmail:
                  $ref: '#/components/examples/InvalidEmail'
                invalidPassword:
                  $ref: '#/components/examples/InvalidPassword'
        '401':
          description: Session expirée ou invalide (`INVALID_CREDENTIALS`) ; recommencer avec `POST /auth/login`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: INVALID_CREDENTIALS
                  message: Invalid session for the user, session is expired.
                requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '5XX':
          $ref: '#/components/responses/ServerError'

  /auth/forgot-password:
    post:
      tags: [Authentification]
      operationId: forgotPassword
      summary: Demander la réinitialisation du mot de passe
      description: |-
        Envoie par e-mail un code de réinitialisation du mot de passe (à utiliser avec `POST /auth/reset-password`).

        La réponse est **toujours** `202`, que le compte existe ou non, afin de ne pas permettre l'énumération des comptes. Limite de débit renforcée (2 requêtes/s).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          description: Demande prise en compte.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: If an account exists for this e-mail, a reset code has been sent.
        '400':
          description: E-mail invalide (`VALIDATION_ERROR`) ou paramètre refusé par Cognito (`INVALID_PARAMETER`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidEmail:
                  $ref: '#/components/examples/InvalidEmail'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '5XX':
          $ref: '#/components/responses/ServerError'

  /auth/reset-password:
    post:
      tags: [Authentification]
      operationId: resetPassword
      summary: Réinitialiser le mot de passe
      description: Définit un nouveau mot de passe à l'aide du code reçu par e-mail après `POST /auth/forgot-password`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
