    TagCount:
      type: object
      required: [tag, postCount]
      properties:
        tag:
          type: string
          description: Tag normalisé.
        postCount:
          type: integer
          minimum: 1
          description: Nombre d'articles publiés portant ce tag.
    TagList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: Tags triés par nombre d'articles décroissant, puis par ordre alphabétique.
          items:
            $ref: '#/components/schemas/TagCount'
      example:
        items:
          - tag: aws
            postCount: 12
          - tag: serverless
            postCount: 9
          - tag: dynamodb
            postCount: 4

    # ----------------------------------------------------------- Subscriptions
    SubscriptionRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        tags:
          type: array
          maxItems: 10
          description: Ne recevoir que les articles portant au moins l'un de ces tags (normalisés, chacun devant contenir au moins une lettre ou un chiffre) ; absent ou vide, tous les articles.
          items:
            type: string
            minLength: 1
            maxLength: 40
    SubscriptionPending:
      type: object
      required: [email, tags, status, message]
      properties:
        email:
          type: string
          format: email
        tags:
          type: array
          description: Tags demandés, normalisés (vide = tous les articles). Une adresse déjà abonnée conserve toutefois ses préférences d'origine.
          items:
            type: string
        status:
          type: string
          enum: [pending_confirmation]
        message:
          type: string
          description: Instructions (en anglais).
      example:
        email: lectrice@example.com
        tags: [serverless, dynamodb]
        status: pending_confirmation
        message: Check your inbox (and spam folder) to confirm your subscription.
    Subscription:
      type: object
      required: [email, status, subscriptionArn]
      properties:
        email:
          type: string
          format: email
        status:
          type: string
          enum: [pending_confirmation, confirmed]
          description: '`confirmed` une fois le lien de confirmation cliqué.'
        subscriptionArn:
          type: string
          nullable: true
          description: ARN de l'abonnement Amazon SNS, `null` tant qu'il n'est pas confirmé.
      example:
        email: lectrice@example.com
        status: confirmed
        subscriptionArn: arn:aws:sns:eu-west-3:123456789012:blogify-dev-NewPostTopic-AbCdEf123456:5f1c2d3e-4b5a-4c6d-9e8f-7a6b5c4d3e2f
    SubscriptionList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Subscription'
        nextCursor:
          type: string
          nullable: true
          description: Curseur de la page suivante (`null` sur la dernière page).

    # ------------------------------------------------------------------ System
    Health:
      type: object
      required: [status, service, version, stage, time]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
          enum: [blogify]
        version:
          type: string
          description: Version déployée de l'application.
        stage:
          type: string
          description: Stage de déploiement.
        time:
          type: string
          format: date-time
          description: Heure du serveur (UTC).
      example:
        status: ok
        service: blogify
        version: 1.0.0
        stage: dev
        time: '2026-10-27T09:30:00.000Z'
