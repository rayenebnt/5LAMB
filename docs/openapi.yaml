        Met à jour le profil de l'utilisateur connecté (au moins un champ). `null` efface `bio`, `avatarUrl` ou `website`.

        Un changement de `name` est aussi appliqué au compte Cognito : il figure dans les prochains jetons et sur les futurs articles et commentaires ; les articles existants conservent le nom d'auteur d'origine.
      security:
