        '400':
          description: Données invalides (`VALIDATION_ERROR`, par exemple `authorName` manquant pour un commentaire anonyme ou identifiant mal formé) ou `parentId` qui ne désigne pas un commentaire approuvé de cet article (`INVALID_PARENT`).
          content:
