        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '5XX':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [Utilisateurs]
      operationId: inviteUser
      summary: Créer (inviter) un utilisateur
      description: |-
        Crée un compte avec le rôle choisi, par exemple un éditeur. Cognito envoie à l'utilisateur un e-mail d'invitation contenant un mot de passe temporaire (valable 7 jours) ; à la première connexion, `POST /auth/login` renvoie le défi `NEW_PASSWORD_REQUIRED` (voir `POST /auth/new-password`).

        Permission `user:manage` (administrateurs).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInviteRequest'
      responses:
        '201':
          description: Compte créé, invitation envoyée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
              example:
                id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                email: eddie.durand@example.com
                name: Eddie Durand
                status: FORCE_CHANGE_PASSWORD
                enabled: true
                role: editor
                createdAt: '2026-10-18T11:00:00.000Z'
                updatedAt: '2026-10-18T11:00:00.000Z'
        '400':
          description: Données invalides (`VALIDATION_ERROR`) ou paramètre refusé par Cognito (`INVALID_PARAMETER`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidEmail:
                  $ref: '#/components/examples/InvalidEmail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/UserExists'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '5XX':
          $ref: '#/components/responses/ServerError'

  /users/{userId}:
    patch:
      tags: [Utilisateurs]
      operationId: updateUser
      summary: Modifier le rôle ou l'état d'un compte
      description: |-
        Change le rôle d'un utilisateur et/ou active ou désactive son compte (au moins un champ).

        - Un changement de rôle prend effet au prochain renouvellement de jeton de l'utilisateur (ou à sa prochaine connexion).
        - La désactivation révoque aussi ses refresh tokens ; les ID tokens déjà émis restent valables jusqu'à leur expiration (60 minutes au plus).
        - Un administrateur ne peut ni changer son propre rôle ni désactiver son propre compte (`409 SELF_MODIFICATION`).

        Permission `user:manage` (administrateurs).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
            examples:
              promote:
                summary: Promouvoir en éditeur
                value:
                  role: editor
              disable:
                summary: Désactiver le compte
                value:
                  enabled: false
      responses:
        '200':
          description: Compte mis à jour.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Un administrateur ne peut pas modifier son propre rôle ni se désactiver (`SELF_MODIFICATION`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: SELF_MODIFICATION
                  message: Administrators cannot change their own role or disable their own account
                requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '5XX':
          $ref: '#/components/responses/ServerError'

  # ---------------------------------------------------------------------------
  # Articles (PostsQueryFunction / PostsCommandFunction)
  # ---------------------------------------------------------------------------
  /posts:
    get:
      tags: [Articles]
      operationId: listPosts
      summary: Lister les articles
      description: |-
        Liste paginée d'articles, du plus récent au plus ancien (date de publication pour `published`, date de dernière modification pour les autres statuts). Les éléments sont des résumés : le contenu (`content`) n'est jamais inclus dans une liste.

        | Filtres | Accès | Résultat |
        |---|---|---|
        | aucun | public | articles publiés |
        | `tag` | public | articles publiés portant ce tag (projection asynchrone) |
        | `author` | public (`me` : jeton requis) | articles publiés de cet auteur |
        | `status` ≠ `published` | jeton requis | éditeurs et administrateurs : tous les articles de ce statut (filtrables par `author`) ; autres utilisateurs : uniquement leurs propres articles |

        `tag` ne peut pas être combiné avec un statut autre que `published`. La réponse est cachable (`public`) uniquement pour un appel anonyme.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit50'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          required: false
          description: Statut des articles à lister. Un statut autre que `published` exige un jeton.
          schema:
            $ref: '#/components/schemas/PostStatus'
        - name: tag
          in: query
          required: false
          description: Tag recherché (normalisé comme à l'enregistrement, « Serverless AWS » devient `serverless-aws`).
          schema:
            type: string
            minLength: 1
          example: serverless
        - name: author
          in: query
          required: false
          description: Identifiant (`sub` Cognito) d'un auteur, ou `me` pour l'appelant (jeton requis).
          schema:
            type: string
            minLength: 1
          example: me
      responses:
        '200':
          description: Page d'articles (résumés).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostList'
              example:
                items:
                  - id: 0192f4a0-5b1c-7d2e-8f3a-4b5c6d7e8f90
                    slug: architecture-serverless-avec-aws-lambda
                    title: Architecture serverless avec AWS Lambda
                    excerpt: Concevoir une API REST scalable et économique avec API Gateway, Lambda et DynamoDB.
                    coverImageUrl: https://d1a2b3c4d5e6f7.cloudfront.net/media/0192f4c2-3d4e-7f5a-8b6c-7d8e9f0a1b2c/schema-architecture.png
                    tags: [aws, serverless, dynamodb]
                    status: published
                    allowComments: true
                    author:
                      id: 3f8a2b1c-4d5e-4f60-8a7b-9c0d1e2f3a4b
                      name: Gaby Martin
                    readingTimeMinutes: 4
                    commentCount: 2
                    reviewNote: null
                    createdAt: '2026-10-20T08:30:00.000Z'
                    updatedAt: '2026-10-22T14:05:12.000Z'
                    submittedAt: '2026-10-21T09:15:00.000Z'
                    publishedAt: '2026-10-22T14:05:12.000Z'
                    version: 4
                nextCursor: eyJQSyI6IlBPU1QjMDE5MmY0YTAtNWIxYy03ZDJlLThmM2EtNGI1YzZkN2U4ZjkwIiwiU0siOiJQT1NUIiwiR1NJMVBLIjoiUE9TVFMjcHVibGlzaGVkIiwiR1NJMVNLIjoiMjAyNi0xMC0yMlQxNDowNToxMi4wMDBaIzAxOTJmNGEwLTViMWMtN2QyZS04ZjNhLTRiNWM2ZDdlOGY5MCJ9
        '400':
          description: Paramètre invalide (`VALIDATION_ERROR`), curseur invalide ou `tag` combiné avec un statut autre que `published` (`BAD_REQUEST`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidLimit:
                  summary: limit hors bornes
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: Request validation failed
                      details:
                        - field: limit
                          message: 'Too big: expected number to be <=50'
                    requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
                tagWithStatus:
                  summary: tag avec un statut non publié
                  value:
                    error:
                      code: BAD_REQUEST
                      message: The tag filter is only available for published posts
                    requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
        '401':
          description: Jeton invalide ou expiré, ou jeton absent alors que `status` n'est pas `published` ou que `author=me` (`UNAUTHORIZED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: UNAUTHORIZED
                  message: Authentication required
                requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
        '403':
          description: Un utilisateur sans la permission `post:read:any` demande les articles non publiés d'un autre auteur (`FORBIDDEN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: FORBIDDEN
                  message: You can only list your own unpublished posts
                requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '5XX':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [Articles]
      operationId: createPost
      summary: Créer un article (brouillon)
      description: |-
        Crée un article au statut `draft` dont l'appelant est l'auteur.

        - Le slug est dérivé du titre et rendu unique par un suffixe (`-2`, `-3`…), sauf si un `slug` personnalisé est fourni (déjà utilisé → `409 SLUG_TAKEN`).
        - Le résumé est généré à partir du contenu si `excerpt` est absent ou vide ; le temps de lecture est calculé (200 mots/minute).
        - Les tags sont normalisés (minuscules, sans accents, mots séparés par des tirets) et dédoublonnés.

        Permission `post:create` (tous les rôles).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostCreateRequest'
            examples:
              minimal:
                summary: Titre seul
                value:
                  title: Premiers pas avec DynamoDB
              complete:
                summary: Article complet
                value:
                  title: Premiers pas avec DynamoDB
                  content: "Modélisation single-table, clés composites et index secondaires : l'essentiel pour bien démarrer avec **DynamoDB**."
                  tags: [DynamoDB, NoSQL]
                  slug: premiers-pas-avec-dynamodb
                  coverImageUrl: https://d1a2b3c4d5e6f7.cloudfront.net/media/0192f4c2-3d4e-7f5a-8b6c-7d8e9f0a1b2c/schema-architecture.png
                  allowComments: true
      responses:
        '201':
          description: Article créé (brouillon).
          headers:
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
              example:
                id: 0192f6e1-8a2b-7c3d-9e4f-5a6b7c8d9e0f
                slug: premiers-pas-avec-dynamodb
                title: Premiers pas avec DynamoDB
                excerpt: "Modélisation single-table, clés composites et index secondaires : l'essentiel pour bien démarrer avec DynamoDB."
                content: "Modélisation single-table, clés composites et index secondaires : l'essentiel pour bien démarrer avec **DynamoDB**."
                coverImageUrl: https://d1a2b3c4d5e6f7.cloudfront.net/media/0192f4c2-3d4e-7f5a-8b6c-7d8e9f0a1b2c/schema-architecture.png
                tags: [dynamodb, nosql]
                status: draft
                allowComments: true
                author:
                  id: 3f8a2b1c-4d5e-4f60-8a7b-9c0d1e2f3a4b
                  name: Gaby Martin
                readingTimeMinutes: 1
                commentCount: 0
                reviewNote: null
                createdAt: '2026-10-25T09:00:00.000Z'
                updatedAt: '2026-10-25T09:00:00.000Z'
                submittedAt: null
                publishedAt: null
                version: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Le slug personnalisé est déjà utilisé par un autre article (`SLUG_TAKEN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: SLUG_TAKEN
                  message: The slug 'premiers-pas-avec-dynamodb' is already used by another post
                requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '5XX':
          $ref: '#/components/responses/ServerError'

  /posts/{postId}:
    get:
      tags: [Articles]
      operationId: getPost
      summary: Lire un article (par identifiant ou slug)
      description: |-
        Renvoie un article complet, avec son contenu Markdown, à partir de son identifiant **ou de son slug**.

        Un article non publié n'est visible que de son auteur et des éditeurs et administrateurs : pour tout autre appelant (anonyme compris), la réponse est `404`. L'en-tête `ETag` contient la version courante, à renvoyer dans `If-Match` lors d'une modification. Un article publié lu anonymement est cachable.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostIdOrSlug'
      responses:
        '200':
          description: Article complet.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '5XX':
          $ref: '#/components/responses/ServerError'
    patch:
      tags: [Articles]
      operationId: updatePost
      summary: Modifier un article
      description: |-
        Modifie partiellement un article (au moins un champ). `excerpt: null` rétablit le résumé automatique et `coverImageUrl: null` supprime l'image de couverture ; un nouveau `slug` libère l'ancien. Le statut ne se modifie pas ici : utilisez les routes du workflow éditorial.

        - L'auteur (`post:update:own`) peut modifier son article tant qu'il est `draft` ou `in_review` (sinon `403`).
        - Les éditeurs et administrateurs (`post:update:any`) peuvent modifier tout article, quel que soit son statut.

        Envoyez `If-Match` (valeur de l'`ETag`) pour ne pas écraser une modification concurrente (`412`). Sans `If-Match`, un conflit d'écriture simultanée est retenté une fois puis signalé par `409 CONFLICT`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostUpdateRequest'
            examples:
              content:
                summary: Modifier le contenu et les tags
                value:
                  content: "# Introduction\n\nUne API **serverless** repose sur trois services : API Gateway, Lambda et DynamoDB."
                  tags: [aws, serverless, dynamodb]
              resetExcerpt:
                summary: Revenir au résumé automatique
                value:
                  excerpt: null
      responses:
        '200':
          description: Article modifié (version incrémentée).
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Slug déjà utilisé (`SLUG_TAKEN`) ou modification concurrente persistante sans `If-Match` (`CONFLICT`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                slugTaken:
                  summary: Slug déjà utilisé
                  value:
                    error:
                      code: SLUG_TAKEN
                      message: The slug 'architecture-serverless' is already used by another post
                    requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
                concurrentUpdate:
                  summary: Écritures simultanées
                  value:
                    error:
                      code: CONFLICT
                      message: The post was modified concurrently, please retry
                    requestId: c0a8012e-5f3b-4a1d-9e7c-2b8d4f6a1c3e
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '5XX':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [Articles]
      operationId: deletePost
      summary: Supprimer un article
      description: |-
        Supprime définitivement un article et libère son slug. Ses commentaires, ses entrées d'index de recherche et ses tags sont supprimés de façon asynchrone.

        - L'auteur (`post:delete:own`) peut supprimer son article tant qu'il est `draft` ou `in_review` (sinon `403`).
        - Les éditeurs et administrateurs (`post:delete:any`) peuvent supprimer tout article.

        `If-Match` est facultatif (suppression refusée avec `412` si l'article a changé depuis sa lecture).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostId'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Article supprimé.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '5XX':
          $ref: '#/components/responses/ServerError'

