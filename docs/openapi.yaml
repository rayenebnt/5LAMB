          type: string
          format: date-time
          nullable: true
          description: Date de la dernière soumission à relecture.
        publishedAt:
          type: string
          format: date-time
          nullable: true
          description: Date de première publication (conservée lors d'une republication).
        version:
          type: integer
          minimum: 1
          description: Version de l'article, incrémentée à chaque modification (reprise dans l'`ETag`).
      example:
        id: 0192f4a0-5b1c-7d2e-8f3a-4b5c6d7e8f90
